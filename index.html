<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QUIZ BATTLE - 밀어내라, 용사여!</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c121f;
      color: #fff;
      padding: 0;
    }

    .game {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: none;
      max-height: none;
      background: linear-gradient(#121d31 0%, #0c121f 66%, #1d100d 100%);
      border: 0;
      border-radius: 0;
      padding: clamp(10px, 1.5vh, 18px) clamp(14px, 1.6vw, 30px) clamp(10px, 1.2vh, 16px);
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px minmax(0, 1fr);
      gap: clamp(14px, 1.6vw, 28px);
      align-items: start;
      margin-bottom: 6px;
      flex: 0 0 auto;
    }

    .fighter-status {
      min-width: 0;
      background: rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 10px 16px;
    }

    .fighter-status.enemy { text-align: right; }

    .name {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 7px;
    }

    .hp-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .enemy .hp-row { justify-content: flex-end; }

    .heart {
      font-size: 23px;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.3));
    }

    .heart.empty { opacity: .18; filter: grayscale(1); }

    .stat-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-top: 10px;
    }

    .enemy .stat-grid { justify-content: flex-end; }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.09);
      color: #dbeafe;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .stat-pill.core { color: #fff; background: rgba(59,130,246,.15); }
    .enemy .stat-pill.core { background: rgba(239,68,68,.13); }
    .stat-pill.proc { color: #cffafe; }
    .stat-pill.combo { color: #fde68a; }
    .stat-pill.healstat { color: #bbf7d0; }
    .stat-pill.temp { color: #e9d5ff; border-color: rgba(192,132,252,.3); }
    .stat-pill.boss { color: #fecaca; border-color: rgba(248,113,113,.36); background: rgba(127,29,29,.25); }
    .stat-pill.enemy-type { color: #f8fafc; border-color: rgba(148,163,184,.38); background: rgba(51,65,85,.38); }
    .stat-pill.enemy-type.type-tank { color: #fecaca; border-color: rgba(248,113,113,.42); }
    .stat-pill.enemy-type.type-attacker { color: #fda4af; border-color: rgba(244,63,94,.45); }
    .stat-pill.enemy-type.type-pusher { color: #fed7aa; border-color: rgba(249,115,22,.45); }
    .stat-pill.enemy-type.type-heavy { color: #e2e8f0; border-color: rgba(148,163,184,.52); }
    .stat-pill.resist { color: #bfdbfe; border-color: rgba(96,165,250,.34); background: rgba(30,64,175,.17); }
    .stat-pill.reward { color: #fef3c7; border-color: rgba(251,191,36,.34); background: rgba(146,64,14,.20); }

    .stage-center {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 10px;
    }

    .round-info {
      font-weight: 1000;
      color: #f8fafc;
      white-space: nowrap;
      text-align: center;
      font-size: 22px;
      line-height: 1;
      letter-spacing: .025em;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,.28);
    }

    .minimap-row {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 0 7px;
      padding: 0 20px;
      flex: 0 0 auto;
    }

    .minimap-shell {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 6px;
      width: min(1120px, 76%);
      margin: 0 auto;
    }

    .minimap-edge {
      font-size: 15px;
      line-height: 1;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.45));
    }

    .minimap-track {
      display: grid;
      gap: 2px;
      min-width: 0;
      height: 22px;
      padding: 3px;
      border-radius: 8px;
      background: rgba(2,6,23,.72);
      border: 1px solid rgba(148,163,184,.26);
      box-shadow: inset 0 1px 5px rgba(0,0,0,.45);
    }

    .minimap-cell {
      position: relative;
      min-width: 0;
      border-radius: 3px;
      background: #596575;
      border: 1px solid rgba(255,255,255,.13);
    }

    .minimap-cell.treasure {
      background: #b98427;
      box-shadow: inset 0 0 0 1px rgba(253,230,138,.55);
    }

    .minimap-cell.treasure.opened { background: #76613d; }

    .minimap-marker {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.9);
      box-shadow: 0 1px 4px rgba(0,0,0,.55);
    }

    .minimap-marker.player { background: #3182f6; }
    .minimap-marker.enemy { background: #ef4444; }

    .arena-wrap {
      position: relative;
      padding: 28px 0 62px;
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(#263752 0%, #1d2a3d 68%, #4a1f10 68%, #9c2e0b 100%);
      min-height: 210px;
      flex: 1 1 290px;
    }

    .arena-camera {
      position: absolute;
      z-index: 2;
      left: 0;
      top: 100px;
      width: max-content;
      will-change: transform;
      transition: transform .62s cubic-bezier(.2,.78,.2,1);
    }

    .stage-map-intro {
      position: absolute;
      z-index: 22;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      min-width: 230px;
      padding: 9px 18px;
      border-radius: 999px;
      text-align: center;
      font-weight: 1000;
      letter-spacing: .03em;
      color: #fff;
      background: rgba(15,23,42,.78);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .25s ease;
    }

    .stage-map-intro.show {
      opacity: 1;
      transform: translateX(-50%) translateY(2px);
    }

    .lava {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      background:
        radial-gradient(circle at 10% 15%, #ffd85a 0 7px, transparent 8px),
        radial-gradient(circle at 35% 55%, #ffb21d 0 9px, transparent 10px),
        radial-gradient(circle at 65% 20%, #ffd85a 0 6px, transparent 7px),
        radial-gradient(circle at 85% 65%, #ffb21d 0 8px, transparent 9px),
        linear-gradient(#ff7b18, #b52109);
      animation: lavaMove 2.2s linear infinite alternate;
      opacity: .95;
    }

    @keyframes lavaMove {
      from { filter: brightness(.95) saturate(1); }
      to { filter: brightness(1.14) saturate(1.15); }
    }

    .arena {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, 88px);
      gap: 8px;
      width: max-content;
      margin: 0;
      transform-origin: left center;
      transition: transform .68s cubic-bezier(.2,.78,.2,1);
      will-change: transform;
    }

    .tile {
      width: 88px;
      height: 82px;
      border-radius: 12px 12px 7px 7px;
      background: linear-gradient(#7e8998, #4f5966);
      border: 2px solid #9ea7b3;
      box-shadow: 0 9px 0 #303844, 0 12px 16px rgba(0,0,0,.25);
      position: relative;
    }

    .tile::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 9px;
      height: 3px;
      background: rgba(255,255,255,.15);
      border-radius: 99px;
    }

    .tile.treasure-active {
      background: linear-gradient(#e8c45c, #9a681e);
      border-color: #ffe69a;
      box-shadow: 0 9px 0 #604213, 0 12px 18px rgba(0,0,0,.28), 0 0 24px rgba(250,204,21,.34);
      animation: treasureGlow 1.15s ease-in-out infinite alternate;
    }

    @keyframes treasureGlow {
      from { filter: brightness(.96); }
      to { filter: brightness(1.13); }
    }

    .treasure-mark {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 22px;
      transform: translate(-50%, -43%);
      border: 3px solid rgba(77,44,10,.88);
      border-radius: 5px;
      background: #d89928;
      box-shadow: inset 0 -4px 0 rgba(98,54,8,.25), 0 2px 6px rgba(0,0,0,.28);
      pointer-events: none;
    }

    .treasure-mark::before {
      content: "";
      position: absolute;
      left: -3px;
      top: -12px;
      width: 34px;
      height: 13px;
      border: 3px solid rgba(77,44,10,.88);
      border-bottom-width: 2px;
      border-radius: 9px 9px 3px 3px;
      background: #f0b83d;
      transform-origin: left bottom;
      transition: transform .22s ease, top .22s ease;
    }

    .treasure-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 4px;
      width: 7px;
      height: 9px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: #fff0a6;
      border: 2px solid rgba(77,44,10,.75);
    }

    .tile.treasure-opened .treasure-mark {
      opacity: .72;
      background: #b88636;
      box-shadow: none;
    }

    .tile.treasure-opened .treasure-mark::before {
      top: -7px;
      transform: rotate(-28deg) translate(-3px, -8px);
      background: #c89542;
    }

    .tile.treasure-triggered {
      animation: treasureTrigger .5s ease-out;
    }

    @keyframes treasureTrigger {
      0% { transform: scale(1); filter: brightness(1); }
      45% { transform: scale(1.08); filter: brightness(1.55); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .fighter {
      position: absolute;
      z-index: 5;
      width: 66px;
      min-width: 66px;
      max-width: 66px;
      aspect-ratio: 1 / 1;
      bottom: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 900;
      border: 4px solid rgba(255,255,255,.88);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      transition: left .28s cubic-bezier(.18,.85,.25,1), transform .14s ease, opacity .22s ease;
      user-select: none;
    }

    .fighter.player { background: #3182f6; }

    /* v31: enemy archetypes use distinct silhouettes. */
    .fighter.enemy {
      width: var(--enemy-size, 66px);
      min-width: var(--enemy-size, 66px);
      max-width: var(--enemy-size, 66px);
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      color: #fff;
      isolation: isolate;
      text-shadow: 0 2px 5px rgba(0,0,0,.55);
    }
    .fighter.enemy::before,
    .fighter.enemy::after {
      content: "";
      position: absolute;
      inset: 0;
      clip-path: var(--enemy-shape, circle(50%));
      pointer-events: none;
    }
    .fighter.enemy::before {
      z-index: -2;
      background: rgba(255,255,255,.94);
      filter: drop-shadow(0 9px 11px rgba(0,0,0,.38));
    }
    .fighter.enemy::after {
      z-index: -1;
      inset: 4px;
      background: var(--enemy-fill, linear-gradient(145deg,#ff6b6b,#dc2626));
    }
    .fighter.enemy.enemy-type-tank {
      --enemy-shape: polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
      --enemy-fill: linear-gradient(145deg,#f87171,#b91c1c);
    }
    .fighter.enemy.enemy-type-attacker {
      --enemy-shape: polygon(50% 0%,100% 94%,0% 94%);
      --enemy-fill: linear-gradient(145deg,#fb7185,#be123c);
      padding-top: 13px;
    }
    .fighter.enemy.enemy-type-pusher {
      --enemy-shape: polygon(50% 0%,100% 50%,50% 100%,0% 50%);
      --enemy-fill: linear-gradient(145deg,#f97316,#c2410c);
    }
    .fighter.enemy.enemy-type-heavy {
      --enemy-shape: polygon(7% 7%,93% 7%,93% 93%,7% 93%);
      --enemy-fill: linear-gradient(145deg,#ef4444,#991b1b);
    }
    /* v34: bosses use a clearly different monochrome metallic palette. */
    .fighter.enemy.enemy-boss::before {
      background: linear-gradient(135deg,#f8fafc 0%,#94a3b8 42%,#334155 72%,#e2e8f0 100%);
      filter: drop-shadow(0 0 10px rgba(226,232,240,.52)) drop-shadow(0 12px 14px rgba(0,0,0,.66));
      animation: enemyBossGlow 1.15s ease-in-out infinite alternate;
    }
    .fighter.enemy.enemy-boss::after {
      inset: 6px;
      background: linear-gradient(145deg,#52525b 0%,#27272a 48%,#09090b 100%);
      box-shadow: inset 8px 8px 12px rgba(255,255,255,.09), inset -9px -10px 14px rgba(0,0,0,.48);
    }
    .fighter.enemy.enemy-final-boss {
      font-size: 43px;
      --enemy-shape: polygon(50% 0%,62% 15%,80% 8%,82% 28%,100% 36%,87% 52%,97% 70%,76% 73%,70% 96%,50% 84%,30% 96%,24% 73%,3% 70%,13% 52%,0% 36%,18% 28%,20% 8%,38% 15%);
    }
    .fighter.enemy.enemy-final-boss::before {
      background: linear-gradient(135deg,#ffffff 0%,#cbd5e1 20%,#475569 46%,#111827 72%,#f8fafc 100%);
      filter: drop-shadow(0 0 18px rgba(248,250,252,.82)) drop-shadow(0 0 34px rgba(148,163,184,.48)) drop-shadow(0 14px 18px rgba(0,0,0,.78));
      animation: finalBossGlow .72s ease-in-out infinite alternate;
    }
    .fighter.enemy.enemy-final-boss::after {
      inset: 7px;
      background: radial-gradient(circle at 38% 28%,#52525b 0%,#18181b 34%,#09090b 68%,#000 100%);
      box-shadow: inset 11px 10px 14px rgba(255,255,255,.10), inset -12px -12px 18px rgba(0,0,0,.62);
    }
    @keyframes enemyBossGlow {
      from { filter: drop-shadow(0 0 7px rgba(226,232,240,.38)) drop-shadow(0 12px 14px rgba(0,0,0,.60)); }
      to   { filter: drop-shadow(0 0 17px rgba(248,250,252,.78)) drop-shadow(0 12px 14px rgba(0,0,0,.72)); }
    }
    @keyframes finalBossGlow {
      from { filter: drop-shadow(0 0 13px rgba(248,250,252,.62)) drop-shadow(0 0 25px rgba(100,116,139,.34)) drop-shadow(0 14px 18px rgba(0,0,0,.72)); }
      to   { filter: drop-shadow(0 0 27px rgba(255,255,255,.96)) drop-shadow(0 0 46px rgba(148,163,184,.58)) drop-shadow(0 14px 18px rgba(0,0,0,.82)); }
    }

    .fighter.hit { transform: scale(.88) rotate(-5deg); }
    .fighter.attack-right { transform: translateX(18px) scale(1.06); }
    .fighter.attack-left { transform: translateX(-18px) scale(1.06); }
    .fighter.fall { transform: translateY(165px) rotate(22deg); opacity: 0; }

    /* v32: HP defeat is visually distinct from falling. */
    .fighter.enemy.defeated {
      animation: enemyDefeat .64s cubic-bezier(.2,.75,.2,1) forwards !important;
      pointer-events: none;
    }
    .fighter.enemy.defeated-final {
      animation: finalEnemyDefeat .92s cubic-bezier(.16,.78,.2,1) forwards !important;
      pointer-events: none;
    }
    @keyframes enemyDefeat {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
      18%  { transform: scale(1.16) rotate(-7deg); opacity: 1; filter: brightness(1.45); }
      36%  { transform: scale(.88) rotate(7deg); opacity: 1; filter: brightness(1.8); }
      56%  { transform: scale(1.05) rotate(-4deg); opacity: 1; filter: brightness(2.1); }
      100% { transform: scale(.06) rotate(38deg) translateY(-22px); opacity: 0; filter: brightness(3) saturate(.4); }
    }
    @keyframes finalEnemyDefeat {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
      14%  { transform: scale(1.22) rotate(-7deg); opacity: 1; filter: brightness(1.55); }
      30%  { transform: scale(.9) rotate(8deg); opacity: 1; filter: brightness(1.85); }
      48%  { transform: scale(1.18) rotate(-5deg); opacity: 1; filter: brightness(2.25); }
      68%  { transform: scale(.78) rotate(10deg); opacity: .95; filter: brightness(2.7); }
      100% { transform: scale(.03) rotate(58deg) translateY(-34px); opacity: 0; filter: brightness(3.4) saturate(.25); }
    }

    .enemy-defeat-ring {
      position: absolute;
      z-index: 16;
      width: 38px;
      height: 38px;
      border: 5px solid rgba(255,244,166,.95);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%,-50%) scale(.4);
      animation: enemyDefeatRing .62s ease-out forwards;
      box-shadow: 0 0 24px rgba(250,204,21,.8);
    }
    .enemy-defeat-ring.final {
      width: 56px;
      height: 56px;
      border-width: 7px;
      animation-duration: .88s;
      box-shadow: 0 0 36px rgba(250,204,21,.95), 0 0 58px rgba(249,115,22,.62);
    }
    @keyframes enemyDefeatRing {
      0% { transform: translate(-50%,-50%) scale(.35); opacity: 0; }
      22% { opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(3.2); opacity: 0; }
    }
    .enemy-defeat-particle {
      position: absolute;
      z-index: 17;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: #fde68a;
      box-shadow: 0 0 10px rgba(250,204,21,.9);
      pointer-events: none;
      transform: translate(-50%,-50%);
      animation: enemyDefeatParticle .58s ease-out forwards;
    }
    .enemy-defeat-particle.final {
      width: 13px;
      height: 13px;
      animation-duration: .84s;
      background: #fff7b2;
      box-shadow: 0 0 16px rgba(249,115,22,.95);
    }
    @keyframes enemyDefeatParticle {
      0% { transform: translate(-50%,-50%) scale(.8); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.2); opacity: 0; }
    }

    .arena-wrap.shake { animation: arenaShake .19s linear; }
    @keyframes arenaShake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      55% { transform: translateX(5px); }
      80% { transform: translateX(-2px); }
    }

    .impact {
      position: absolute;
      z-index: 12;
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-size: 48px;
      font-weight: 1000;
      text-shadow: 0 4px 10px rgba(0,0,0,.4);
      animation: impactPop .32s ease-out forwards;
    }

    @keyframes impactPop {
      0% { transform: scale(.25) rotate(-18deg); opacity: 0; }
      35% { transform: scale(1.25) rotate(8deg); opacity: 1; }
      100% { transform: scale(1.65) rotate(18deg); opacity: 0; }
    }


    .floating-number {
      position: absolute;
      z-index: 18;
      min-width: 64px;
      text-align: center;
      font-size: 31px;
      font-weight: 1000;
      line-height: 1;
      color: #fff;
      text-shadow: 0 3px 0 rgba(0,0,0,.42), 0 0 10px rgba(255,255,255,.18);
      pointer-events: none;
      animation: damageFloat .72s cubic-bezier(.18,.78,.26,1) forwards;
    }

    .floating-number.strong {
      font-size: 38px;
      color: #fde68a;
      text-shadow: 0 3px 0 rgba(120,53,15,.72), 0 0 16px rgba(251,146,60,.7);
    }

    .floating-number.crit-text {
      min-width: 124px;
      font-size: 24px;
      color: #fbbf24;
      text-shadow: 0 3px 0 rgba(120,53,15,.82), 0 0 18px rgba(251,191,36,.9);
      animation-duration: .88s;
    }

    .floating-number.push-text {
      min-width: 110px;
      font-size: 23px;
      color: #a5f3fc;
      text-shadow: 0 3px 0 rgba(8,47,73,.75), 0 0 16px rgba(34,211,238,.72);
      animation-duration: .82s;
    }

    .floating-number.resist-text {
      min-width: 130px;
      font-size: 23px;
      color: #bfdbfe;
      text-shadow: 0 3px 0 rgba(30,58,138,.82), 0 0 16px rgba(96,165,250,.86);
      animation-duration: .9s;
    }

    @keyframes damageFloat {
      0% { transform: translate(-50%, 8px) scale(.65); opacity: 0; }
      20% { transform: translate(-50%, -4px) scale(1.18); opacity: 1; }
      72% { opacity: 1; }
      100% { transform: translate(-50%, -55px) scale(.96); opacity: 0; }
    }

    .impact.strong {
      width: 96px;
      height: 96px;
      font-size: 62px;
      filter: drop-shadow(0 0 10px rgba(251,146,60,.95));
    }

    .push-wave {
      position: absolute;
      z-index: 11;
      width: 84px;
      height: 84px;
      border: 5px solid rgba(103,232,249,.92);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 18px rgba(34,211,238,.65), inset 0 0 14px rgba(165,243,252,.45);
      animation: pushWave .48s ease-out forwards;
    }

    .push-wave::after {
      content: "»";
      position: absolute;
      left: 100%;
      top: 50%;

    /* v37: continuous WebAudio BGM + stronger SFX control */
    .bgm-toggle {

    /* v38: four 5-stage worlds. */
    .arena-wrap::before,
    .arena-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .arena-wrap::before { z-index: 0; }
    .arena-wrap::after { z-index: 1; }
    .arena-wrap .lava { z-index: 1; }

    /* 1-5: volcanic wasteland */
    .arena-wrap.theme-lava {
      background:
        radial-gradient(circle at 18% 24%, rgba(255,142,45,.13), transparent 22%),
        radial-gradient(circle at 82% 30%, rgba(239,68,68,.12), transparent 24%),
        linear-gradient(#29364a 0%, #1b2737 60%, #4a1f10 61%, #8f2c0b 100%);
    }
    .arena-wrap.theme-lava::before {
      background:
        linear-gradient(155deg, transparent 0 22%, rgba(17,24,39,.48) 22.5% 24%, transparent 24.5% 100%),
        linear-gradient(25deg, transparent 0 76%, rgba(17,24,39,.45) 76.5% 78%, transparent 78.5% 100%);
      opacity: .8;
    }
    .arena-wrap.theme-lava .lava {
      background:
        radial-gradient(circle at 10% 15%, #ffd85a 0 7px, transparent 8px),
        radial-gradient(circle at 35% 55%, #ffb21d 0 9px, transparent 10px),
        radial-gradient(circle at 65% 20%, #ffd85a 0 6px, transparent 7px),
        radial-gradient(circle at 85% 65%, #ffb21d 0 8px, transparent 9px),
        linear-gradient(#ff7b18, #b52109);
      animation: lavaMove 2.2s linear infinite alternate;
      opacity: .96;
    }

    /* 6-10: ice field over a glacier-filled sea */
    .arena-wrap.theme-ice {
      background:
        radial-gradient(ellipse at 24% 52%, rgba(255,255,255,.72) 0 7%, transparent 7.5%),
        radial-gradient(ellipse at 74% 48%, rgba(225,247,255,.66) 0 10%, transparent 10.5%),
        linear-gradient(#66b9ec 0%, #b9e7fb 44%, #dff7ff 61%, #59a9cc 62%, #1f6f91 100%);
    }
    .arena-wrap.theme-ice::before {
      background:
        linear-gradient(155deg, transparent 0 15%, rgba(238,250,255,.88) 15.4% 20%, rgba(128,194,222,.55) 20.4% 23%, transparent 23.5% 100%),
        linear-gradient(205deg, transparent 0 74%, rgba(240,252,255,.82) 74.4% 79%, rgba(114,183,213,.48) 79.4% 82%, transparent 82.5% 100%);
      opacity: .9;
    }
    .arena-wrap.theme-ice::after {
      background: linear-gradient(to bottom, transparent 0 58%, rgba(224,247,255,.16) 59%, transparent 73%);
    }
    .arena-wrap.theme-ice .lava {
      background:
        radial-gradient(ellipse at 12% 30%, #eefcff 0 32px, #bfe6f5 33px 45px, transparent 46px),
        radial-gradient(ellipse at 38% 66%, #e8f9ff 0 25px, #acd8ea 26px 37px, transparent 38px),
        radial-gradient(ellipse at 68% 24%, #f6fdff 0 38px, #c2e8f5 39px 51px, transparent 52px),
        radial-gradient(ellipse at 90% 60%, #eaf9ff 0 26px, #a8d7e9 27px 39px, transparent 40px),
        linear-gradient(#55b7d8, #0b5475 88%);
      animation: iceSeaMove 4.2s ease-in-out infinite alternate;
      opacity: 1;
    }
    @keyframes iceSeaMove { from { filter: brightness(.94); } to { filter: brightness(1.08); } }
    .arena-wrap.theme-ice .tile:not(.treasure-active) {
      background: linear-gradient(155deg, #f5fdff 0%, #bde9f6 46%, #75b9d4 100%);
      border-color: #f2fcff;
      box-shadow: 0 9px 0 #4b8da9, 0 12px 18px rgba(2,50,73,.34), inset 0 2px 10px rgba(255,255,255,.72);
    }
    .arena-wrap.theme-ice .tile:not(.treasure-active)::after { background: rgba(255,255,255,.72); }

    /* 11-15: sky islands */
    .arena-wrap.theme-sky {
      background:
        radial-gradient(ellipse at 15% 25%, rgba(255,255,255,.92) 0 7%, transparent 7.7%),
        radial-gradient(ellipse at 32% 40%, rgba(255,255,255,.62) 0 10%, transparent 10.7%),
        radial-gradient(ellipse at 72% 24%, rgba(255,255,255,.78) 0 9%, transparent 9.7%),
        radial-gradient(ellipse at 88% 47%, rgba(255,255,255,.56) 0 12%, transparent 12.7%),
        linear-gradient(#63b9f4 0%, #93d7fb 48%, #d9f3ff 100%);
    }
    .arena-wrap.theme-sky::before {
      background:
        radial-gradient(ellipse at 48% 78%, rgba(255,255,255,.54) 0 16%, transparent 16.8%),
        radial-gradient(ellipse at 8% 70%, rgba(255,255,255,.46) 0 12%, transparent 12.8%),
        radial-gradient(ellipse at 94% 74%, rgba(255,255,255,.42) 0 15%, transparent 15.8%);
      animation: skyCloudPulse 6s ease-in-out infinite alternate;
    }
    .arena-wrap.theme-sky::after {
      background: linear-gradient(to bottom, rgba(255,255,255,.08), transparent 38%, rgba(255,255,255,.10) 73%, transparent);
    }
    @keyframes skyCloudPulse { from { transform: translateX(-7px); opacity:.78; } to { transform: translateX(9px); opacity:1; } }
    .arena-wrap.theme-sky .lava {
      background:
        radial-gradient(ellipse at 18% 72%, rgba(255,255,255,.82) 0 12%, transparent 12.8%),
        radial-gradient(ellipse at 51% 46%, rgba(255,255,255,.65) 0 16%, transparent 16.8%),
        radial-gradient(ellipse at 86% 76%, rgba(255,255,255,.74) 0 13%, transparent 13.8%),
        linear-gradient(#8bd4fa, #ccefff);
      animation: skyCloudPulse 5.2s ease-in-out infinite alternate-reverse;
      opacity: 1;
    }
    .arena-wrap.theme-sky .tile:not(.treasure-active) {
      border-radius: 30px 26px 18px 22px;
      background: linear-gradient(150deg, #8a8176 0%, #635a50 48%, #3f3934 100%);
      border-color: #aaa197;
      box-shadow: 0 10px 0 #4d453d, 0 20px 0 -7px #302b27, 0 25px 20px rgba(34,47,55,.34);
    }
    .arena-wrap.theme-sky .tile:not(.treasure-active)::after { background: rgba(230,224,213,.22); }

    /* 16-20: dark gothic demon castle */
    .arena-wrap.theme-castle {

        radial-gradient(ellipse at 19% 36%, rgba(124,58,237,.24) 0 5%, rgba(48,27,73,.18) 7%, transparent 12%),
        radial-gradient(ellipse at 81% 34%, rgba(153,27,27,.22) 0 5%, rgba(66,18,18,.14) 7%, transparent 12%),
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.025) 32px 34px),
        repeating-linear-gradient(90deg, #171720 0 62px, #20212b 63px 65px, #12131a 66px 126px);

    .arena-wrap.theme-castle::before {
      inset: 0 7%;
      background:
        radial-gradient(ellipse at 10% 52%, rgba(105,70,150,.28) 0 4%, transparent 4.5%),
        radial-gradient(ellipse at 90% 52%, rgba(128,49,49,.24) 0 4%, transparent 4.5%),
        repeating-linear-gradient(90deg, transparent 0 12%, rgba(4,5,10,.52) 12.5% 15%, transparent 15.5% 28%);

    .arena-wrap.theme-castle::after {
      background:
        linear-gradient(to bottom, rgba(0,0,0,.0) 0 12%, rgba(0,0,0,.18) 52%, rgba(0,0,0,.38) 100%),

    }
    .arena-wrap.theme-castle .lava {
      background:
        radial-gradient(ellipse at 20% 15%, rgba(95,62,135,.20), transparent 28%),
        radial-gradient(ellipse at 80% 24%, rgba(132,43,43,.18), transparent 25%),

    .arena-wrap.theme-castle .tile:not(.treasure-active) {
      background: linear-gradient(150deg, #494a56 0%, #2f3039 52%, #202129 100%);
      border-color: #70717e;
      box-shadow: 0 9px 0 #16171d, 0 13px 18px rgba(0,0,0,.62), inset 0 1px 8px rgba(255,255,255,.08);
    }
    .arena-wrap.theme-castle .tile:not(.treasure-active)::after { background: rgba(184,177,199,.15); }


    /* v48: mobile layout only. Desktop's fixed canvas remains unchanged. */
    .rotate-notice { display: none; }
    @media (max-width: 1100px), (pointer: coarse) {
      .game-stage {
        left: 0; top: 0; width: 100%; height: 100vh; height: 100dvh;
        transform: none !important; border: 0; border-radius: 0;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      .game {
        width: 100%; height: 100%; display: grid;
        grid-template-columns: clamp(108px, 17vw, 170px) minmax(0, 1fr) clamp(108px, 17vw, 170px);
        grid-template-rows: 28px 16px minmax(130px, .9fr) 22px minmax(145px, 1fr);
        gap: 4px 7px;
        padding: calc(6px + var(--safe-top)) calc(8px + var(--safe-right)) calc(6px + var(--safe-bottom)) calc(8px + var(--safe-left));
        overflow-y: auto; overscroll-behavior: contain;
      }
      .topbar { position: static; display: contents; pointer-events: auto; }
      .topbar > .fighter-status,
      .topbar > .fighter-status.enemy {
        position: relative; inset: auto; width: auto; min-width: 0;
        grid-row: 1 / 6; padding: 8px 6px; border-radius: 10px;
        display: block; overflow-y: auto; overscroll-behavior: contain;
        scrollbar-width: thin; text-align: left;
      }
      .topbar > .fighter-status:not(.enemy) { grid-column: 1; left: auto; padding-bottom: 58px; }
      .topbar > .fighter-status.enemy { grid-column: 3; }
      .name { font-size: 13px; margin-bottom: 6px; }
      .hp-row, .enemy .hp-row { gap: 2px; min-height: 24px; }
      .heart { font-size: 16px; }
      .stat-grid, .enemy .stat-grid { gap: 5px; margin-top: 7px; }
      .stat-pill { min-height: 36px; padding: 6px 5px; font-size: 12px; white-space: normal; gap: 3px; border-radius: 7px; }
      .stat-pill.resist { display: block; line-height: 1.4; word-break: keep-all; }
      .trait-heading { margin-top: 9px; padding: 7px 0; font-size: 12px; }
      .trait-scroll { overflow: visible; padding: 0; gap: 5px; }
      .trait-row { min-height: 36px; padding: 6px 4px; font-size: 12px; gap: 3px; }
      .trait-row span:first-child { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
      .trait-empty { font-size: 12px; padding: 4px 0; }
      .stage-center { position: static; grid-column: 2; grid-row: 1; height: auto; min-width: 0; }
      .round-info { font-size: clamp(14px, 2.3vw, 20px); line-height: 1.1; white-space: normal; }
      .minimap-row { position: static; grid-column: 2; grid-row: 2; width: auto; height: 16px; padding: 0; }
      .minimap-shell { width: 100%; grid-template-columns: 14px minmax(0, 1fr) 14px; gap: 3px; }
      .minimap-track { height: 16px; padding: 2px; gap: 1px; }
      .minimap-marker { width: 9px; height: 9px; border-width: 1px; }
      .minimap-edge { font-size: 12px; }
      .arena-wrap { position: relative; inset: auto; grid-column: 2; grid-row: 3; height: auto; min-height: 130px; border-radius: 10px; }
      /* Preserve horizontal tile coordinates and camera logic; compact only their vertical presentation. */
      .arena-camera { top: max(76px, calc(50% - 6px)); }
      .tile { height: 48px; border-radius: 7px; }
      .fighter { bottom: 14px; }
      .lava { height: 25px; }
      .stage-map-intro { top: 4px; min-width: 0; max-width: calc(100% - 12px); padding: 4px 8px; font-size: 12px; }
      .answer-flash { top: 5px; padding: 4px 10px; font-size: 18px; }
      .message { position: static; grid-column: 2; grid-row: 4; height: auto; font-size: 13px; line-height: 1.25; overflow-y: auto; }
      .quiz { position: static; grid-column: 2; grid-row: 5; min-width: 0; padding: 8px; border-radius: 10px; overflow-y: auto; overscroll-behavior: contain; }
      .question { font-size: clamp(20px, 3vw, 26px); line-height: 1.25; margin-bottom: 8px; overflow-wrap: anywhere; }
      .choices { width: 100%; max-width: none; gap: 7px; }
      button.choice { min-height: 46px; padding: 6px 7px; font-size: clamp(17px, 2.5vw, 21px); line-height: 1.25; border-radius: 9px; overflow-wrap: anywhere; }
      .bgm-toggle { top: auto; right: auto; bottom: calc(8px + var(--safe-bottom)); left: calc(14px + var(--safe-left)); min-width: 0; width: 98px; height: 44px; padding: 0 6px; font-size: 12px; }
      .game-stage:has(.reward-overlay.show, .result-overlay.show) .bgm-toggle { display: none; }

        padding: calc(10px + var(--safe-top)) calc(14px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(14px + var(--safe-left));
        overflow-y: auto; overscroll-behavior: contain;
      }

      .start-title, .game-brand .start-title { font-size: clamp(30px, 5.5vw, 46px); line-height: 1.1; }
      .mode-buttons { gap: 12px; margin-top: 18px !important; }

      .reward-option { min-height: 120px; padding: 10px 8px; border-radius: 11px; }
      .reward-option .card-meta { font-size: 11px; margin-bottom: 6px; gap: 4px; flex-wrap: wrap; }
      .reward-option strong { font-size: 19px; margin-bottom: 6px; line-height: 1.2; overflow-wrap: anywhere; }
      .reward-option .card-desc { min-height: 36px; font-size: 16px; line-height: 1.3; padding: 0; overflow-wrap: anywhere; }
      .result-card { width: min(620px, 100%); }
      .result-detail { margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
      .result-mode-label { font-size: 12px; margin-bottom: 4px; }
      .result-rank { font-size: 48px; margin: 6px auto; }
      .result-stat-main { font-size: 22px; margin: 5px 0 8px; }

    /* v49: keep the existing fighter wrappers and tile coordinates. Only the art changes. */

<body>

  <div class="reward-overlay" id="rewardOverlay">

  </div>


  <div class="status-help-tooltip" id="statusHelpTooltip" role="tooltip">
    <button class="status-help-close" id="statusHelpClose" type="button" aria-label="설명 닫기">×</button>

    <div class="status-help-desc" id="statusHelpDesc"></div>
  </div>

  <script src="questions.js" onerror="console.info('questions.js가 없어 내장 테스트 문제를 사용합니다.');"></script>
  <script>
    const START_PLAYER_HP = 5;
    const TILE_WIDTH = 88;
    const TILE_GAP = 8;
    const FIGHTER_WIDTH = 66;
    const CAMERA_EDGE_PAD = 24;
    const CAMERA_FIGHTER_SAFE_PAD = 72;
    const STANDARD_STAGE_LIMIT = 20;
    let GAME_MODE = null; // "standard" or "endless" after the player chooses a mode.
    let SELECTED_GRADE = null; // Standard mode only. Endless mode progresses 3 -> 4 -> 5 -> 6.


    const STAGE_THEMES = [
      { id:"lava", name:"화산 지대", battleTrack:"lava_battle", bossTrack:"lava_boss" },
      { id:"ice", name:"얼음 지대", battleTrack:"ice_battle", bossTrack:"ice_boss" },
      { id:"sky", name:"공중 유적", battleTrack:"sky_battle", bossTrack:"sky_boss" },
      { id:"castle", name:"마왕성", battleTrack:"castle_battle", bossTrack:"castle_boss" }
    ];

    function getStageTheme(stageNumber) {
      const group = Math.floor((Math.max(1, stageNumber) - 1) / 5);
      // Endless mode keeps rotating through the four visual/music worlds every five stages.
      return STAGE_THEMES[group % STAGE_THEMES.length];
    }

    function applyStageTheme(stageNumber) {
      const theme = getStageTheme(stageNumber);
      arenaWrapEl.classList.remove("theme-lava","theme-ice","theme-sky","theme-castle");
      arenaWrapEl.classList.add(`theme-${theme.id}`);
      state.stageTheme = theme.id;
      state.stageThemeName = theme.name;
      return theme;
    }

    const ENEMY_TYPES = {
      tank: {
        name: "탱커", symbol: "⬢",
        help: "체력이 높고 밀기 저항이 강한 대신 공격력은 비교적 낮습니다.",
        hpMul: 1.34, damageAdd: -1, pushAdd: 0, resistChanceAdd: .08, flatAddAfter: 14
      },
      attacker: {
        name: "공격형", symbol: "▲",
        help: "체력과 저항은 낮지만 공격력이 높아 오답의 HP 손실이 큽니다.",
        hpMul: .84, damageAdd: 1, pushAdd: 0, resistChanceAdd: -.07, flatAddAfter: 999
      },
      pusher: {
        name: "밀기형", symbol: "◆",
        help: "체력은 낮은 편이지만 한 번의 오답으로 더 멀리 밀어냅니다.",
        hpMul: .91, damageAdd: 0, pushAdd: 1, resistChanceAdd: -.03, flatAddAfter: 999
      },
      heavy: {
        name: "중량형", symbol: "■",
        help: "밀기 저항에 특화된 무거운 적입니다. 뒤 스테이지에서는 고정 저항도 가집니다.",
        hpMul: 1.14, damageAdd: 0, pushAdd: 0, resistChanceAdd: .05, flatAddAfter: 8
      }
    };

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const randomEnemyType = () => ["tank","attacker","pusher","heavy"][randInt(0,3)];

    function generateStage(stageNumber) {
      const n = Math.max(1, stageNumber);
      const progress = n - 1;
      const boss = n % 5 === 0;
      const finalBoss = GAME_MODE === "standard" && n === STANDARD_STAGE_LIMIT;
      const enemyType = randomEnemyType();
      const type = ENEMY_TYPES[enemyType];

      // Board growth is quick in the 20-stage campaign, then deliberately slows for endless play.
      const boardGrowth = Math.min(progress, 19) * 1.02 + Math.max(0, progress - 19) * .34;
      let boardLength = Math.max(6, Math.round(6 + boardGrowth + randInt(-1, 1)));
      if (boss) boardLength += 2;
      if (finalBoss) boardLength += 2;

      // HP keeps scaling forever, while archetypes trade raw HP for damage/push/resistance.
      const hpBase = 5 + progress * 1.55 + Math.pow(progress, 1.22) * .34;
      let enemyHp = Math.max(4, Math.round(hpBase * type.hpMul * (boss ? 1.36 : 1) * (finalBoss ? 1.22 : 1)));

      let enemyDamage = 1 + Math.floor(progress / 7) + type.damageAdd;
      enemyDamage = Math.max(1, enemyDamage);
      if (boss && n >= 10) enemyDamage += 1;
      if (finalBoss) enemyDamage += 1;

      let enemyPush = 1 + type.pushAdd;
      if (n >= 12 && enemyType !== "pusher" && Math.random() < .18) enemyPush += 1;
      if (n >= 26 && Math.random() < .15) enemyPush += 1;
      enemyPush = Math.min(4, enemyPush);

      // Chance resistance grows, but is capped so pushing never becomes pointless.
      let pushResistChance = n <= 1 ? 0 : .05 + Math.max(0, n - 2) * .025;
      pushResistChance += type.resistChanceAdd;
      if (boss) pushResistChance += .04;
      pushResistChance = clamp(pushResistChance, 0, .60);

      let pushResistFlat = 0;
      if (n >= type.flatAddAfter) pushResistFlat += 1;
      if (!boss && n >= 13 && Math.random() < clamp(.12 + (n - 13) * .018, .12, .38)) pushResistFlat += 1;
      if (boss) pushResistFlat += 1 + Math.floor(Math.max(0, n - 10) / 10);
      if (finalBoss) pushResistFlat = Math.max(pushResistFlat, 2);
      pushResistFlat = Math.min(pushResistFlat, 4);

      // A single stage should not roll the maximum of everything at once.
      if (enemyDamage >= 4 && enemyPush >= 2 && pushResistFlat >= 2) enemyDamage -= 1;
      if (enemyPush >= 3 && pushResistChance > .45) pushResistChance -= .08;

      return {
        stageNumber: n, boardLength, enemyHp, enemyDamage, enemyPush,
        pushResistFlat, pushResistChance, enemyType,
        enemyTypeName: type.name, enemyTypeSymbol: type.symbol, enemyTypeHelp: type.help,
        boss, finalBoss,
        enemyVisualSize: finalBoss ? 100 : boss ? 84 : 66
      };
    }

    function getStageConfig(stageNumber) {
      const key = String(stageNumber);
      if (!state.generatedStages[key]) state.generatedStages[key] = generateStage(stageNumber);
      return state.generatedStages[key];
    }

    function isFinalCampaignStage() {
      return GAME_MODE === "standard" && state.stageIndex + 1 >= STANDARD_STAGE_LIMIT;
    }

    // Built-in test questions keep this HTML playable before questions.js is generated.
    // When questions.js exists, QUESTION_BANK automatically replaces this fallback set.
    const FALLBACK_QUESTIONS = [
      { id:"TEST_0001", subject:"수학", question:"1 + 1 = ?", choices:["1","2","3","4"], answer:1 },
      { id:"TEST_0002", subject:"수학", question:"2 + 3 = ?", choices:["3","4","5","6"], answer:2 },
      { id:"TEST_0003", subject:"수학", question:"7 - 4 = ?", choices:["2","3","4","5"], answer:1 },
      { id:"TEST_0004", subject:"수학", question:"6 + 2 = ?", choices:["7","8","9","10"], answer:1 },
      { id:"TEST_0005", subject:"수학", question:"9 - 5 = ?", choices:["3","4","5","6"], answer:1 },
      { id:"TEST_0006", subject:"수학", question:"3 + 4 = ?", choices:["5","6","7","8"], answer:2 },
      { id:"TEST_0007", subject:"수학", question:"5 + 5 = ?", choices:["8","9","10","11"], answer:2 },
      { id:"TEST_0008", subject:"수학", question:"8 - 2 = ?", choices:["5","6","7","8"], answer:1 },
      { id:"TEST_0009", subject:"수학", question:"4 × 2 = ?", choices:["6","7","8","9"], answer:2 },
      { id:"TEST_0010", subject:"수학", question:"12 ÷ 3 = ?", choices:["3","4","5","6"], answer:1 },
      { id:"TEST_0011", subject:"수학", question:"7 + 8 = ?", choices:["13","14","15","16"], answer:2 },
      { id:"TEST_0012", subject:"수학", question:"14 - 6 = ?", choices:["7","8","9","10"], answer:1 },
      { id:"TEST_0013", subject:"수학", question:"6 × 3 = ?", choices:["16","17","18","19"], answer:2 },
      { id:"TEST_0014", subject:"수학", question:"20 ÷ 4 = ?", choices:["4","5","6","7"], answer:1 },
      { id:"TEST_0015", subject:"수학", question:"9 + 6 = ?", choices:["14","15","16","17"], answer:1 },
      { id:"TEST_0016", subject:"수학", question:"18 - 9 = ?", choices:["7","8","9","10"], answer:2 },
      { id:"TEST_0017", subject:"수학", question:"5 × 4 = ?", choices:["18","19","20","21"], answer:2 },
      { id:"TEST_0018", subject:"수학", question:"24 ÷ 6 = ?", choices:["3","4","5","6"], answer:1 },
      { id:"TEST_0019", subject:"수학", question:"11 + 7 = ?", choices:["17","18","19","20"], answer:1 },
      { id:"TEST_0020", subject:"수학", question:"16 - 7 = ?", choices:["8","9","10","11"], answer:1 }
    ];

    let ACTIVE_QUESTION_BANK = [];
    let USING_EXTERNAL_QUESTION_BANK = false;

    function parseQuestionGrade(value) {
      const match = String(value ?? "").match(/[3-6]/);
      return match ? Number(match[0]) : null;
    }

    function normalizeQuestion(raw, index) {
      const questionText = String(raw?.question ?? raw?.q ?? "").trim();
      const choices = Array.isArray(raw?.choices) ? raw.choices.map(v => String(v)) : [];
      const answer = Number(raw?.answer);
      if (!questionText || choices.length !== 4 || !Number.isInteger(answer) || answer < 0 || answer > 3) return null;
      return {
        id: String(raw?.id ?? `Q_${String(index + 1).padStart(4,"0")}`),
        subject: String(raw?.subject ?? ""),
        grade: parseQuestionGrade(raw?.grade),
        question: questionText,
        choices,
        answer,
        explanation: String(raw?.explanation ?? "")
      };
    }

    function prepareQuestionBank() {
      const external = (typeof QUESTION_BANK !== "undefined" && Array.isArray(QUESTION_BANK) && QUESTION_BANK.length > 0)
        ? QUESTION_BANK
        : null;
      const source = external || FALLBACK_QUESTIONS;
      ACTIVE_QUESTION_BANK = source.map(normalizeQuestion).filter(Boolean);
      USING_EXTERNAL_QUESTION_BANK = Boolean(external);
    }

    function questionIndexesForGrade(grade) {
      // The built-in fallback is only for testing the game before the real DB is generated.
      // With questions.js loaded, only the selected/current grade is eligible.
      if (!USING_EXTERNAL_QUESTION_BANK) return ACTIVE_QUESTION_BANK.map((_, index) => index);
      return ACTIVE_QUESTION_BANK
        .map((q, index) => q.grade === grade ? index : -1)
        .filter(index => index >= 0);
    }

    function setQuestionPoolForGrade(grade) {
      const indexes = questionIndexesForGrade(grade);
      if (!indexes.length) return false;
      state.questionGrade = grade;
      state.remainingQuestionIndexes = indexes;
      return true;
    }

    function initializeQuestionRun() {
      prepareQuestionBank();
      const initialGrade = GAME_MODE === "standard" ? SELECTED_GRADE : 3;
      if (!setQuestionPoolForGrade(initialGrade)) {
        throw new Error(`${initialGrade}학년 문제를 찾을 수 없습니다.`);
      }
    }

    function advanceEndlessQuestionGrade() {
      if (GAME_MODE !== "endless") return false;
      const nextGrade = state.questionGrade < 6 ? state.questionGrade + 1 : 6;
      return setQuestionPoolForGrade(nextGrade);
    }

    function markCurrentQuestionCorrect() {
      const index = state.currentQuestionIndex;
      const pos = state.remainingQuestionIndexes.indexOf(index);
      if (pos >= 0) state.remainingQuestionIndexes.splice(pos, 1);
    }

    const RARITY_WEIGHT = { common: 100, advanced: 70, rare: 40, legendary: 16 };
    const RARITY_LABEL = { common: "일반", advanced: "고급", rare: "희귀", legendary: "전설" };
    const CATEGORY_LABEL = { red: "공격", blue: "밀기", green: "생존", purple: "특수", gold: "전설", orange: "보물" };

    function traitLevel(id) { return state.traits[id] || 0; }
    function addTrait(id, amount = 1) { state.traits[id] = (state.traits[id] || 0) + amount; }
    function hasTrait(id) { return traitLevel(id) > 0; }

    const rewards = [
      // RED · 공격 10
      { id:"A01", category:"red", rarity:"common", minStage:1, name:"강한 공격", maxLevel:99,
        desc:()=>`기본 공격력 +1 · ⚔ ${state.playerDamage} → ${state.playerDamage+1}`,
        apply(){ addTrait(this.id); state.playerDamage += 1; } },
      { id:"A02", category:"red", rarity:"common", minStage:1, name:"치명타", maxLevel:5,
        desc:()=>`치명타 확률 +15% · 발동 시 ×${state.critMultiplier.toFixed(1).replace('.0','')} · ${pct(state.critChance)} → ${pct(Math.min(.75,state.critChance+.15))}`,
        apply(){ addTrait(this.id); state.critChance=Math.min(.75,state.critChance+.15); } },
      { id:"A03", category:"red", rarity:"common", minStage:1, name:"연속 타격", maxLevel:99,
        desc:()=>`3연속 정답마다 추가 피해 +2 · 현재 +${traitLevel(this.id)*2}`,
        apply(){ addTrait(this.id); } },
      { id:"A04", category:"red", rarity:"advanced", minStage:1, name:"선제공격", maxLevel:1,
        desc:()=>`매 스테이지 첫 번째 정답 공격의 피해 ×2`, apply(){ addTrait(this.id); } },
      { id:"A05", category:"red", rarity:"advanced", minStage:4, name:"처형", maxLevel:99,
        desc:()=>`적 HP가 30% 이하일 때 공격력 +3 · 현재 +${traitLevel(this.id)*3}`,
        apply(){ addTrait(this.id); } },
      { id:"A06", category:"red", rarity:"advanced", minStage:5, name:"집중 포화", maxLevel:99,
        desc:()=>`적이 한 칸도 밀리지 않으면 추가 피해 +3 · 현재 +${traitLevel(this.id)*3}`,
        apply(){ addTrait(this.id); } },
      { id:"A07", category:"red", rarity:"rare", minStage:6, name:"몰아붙이기", maxLevel:1,

    function setStatusHelpData(el, title, desc) {
      if (!el) return;
      el.dataset.helpTitle = title;
      el.dataset.helpDesc = desc;
      el.setAttribute("tabindex", "0");
    }

    let statusHelpPinned = false;
    let statusHelpTarget = null;

    function positionStatusHelp() {
      if (!statusHelpTarget || !statusHelpTooltipEl.classList.contains("show")) return;
      const rect = statusHelpTarget.getBoundingClientRect();
      const tipRect = statusHelpTooltipEl.getBoundingClientRect();
      const margin = 12;
      let left;
      if (rect.left < window.innerWidth / 2) left = rect.right + margin;
      else left = rect.left - tipRect.width - margin;
      if (left + tipRect.width > window.innerWidth - margin) left = window.innerWidth - tipRect.width - margin;
      if (left < margin) left = margin;
      let top = rect.top + rect.height / 2 - tipRect.height / 2;
      top = Math.max(margin, Math.min(window.innerHeight - tipRect.height - margin, top));
      statusHelpTooltipEl.style.left = `${left}px`;
      statusHelpTooltipEl.style.top = `${top}px`;
    }

    function showStatusHelp(target, pin = false) {
      if (!target?.dataset?.helpTitle) return;
      if (statusHelpPinned && !pin && target !== statusHelpTarget) return;
      statusHelpTarget = target;
      statusHelpPinned = pin || statusHelpPinned;
      statusHelpTitleEl.textContent = target.dataset.helpTitle;
      statusHelpDescEl.textContent = target.dataset.helpDesc || "";
      statusHelpTooltipEl.classList.add("show");
      statusHelpTooltipEl.classList.toggle("pinned", statusHelpPinned);
      requestAnimationFrame(positionStatusHelp);
    }

    function hideStatusHelp(force = false) {
      if (statusHelpPinned && !force) return;
      statusHelpPinned = false;
      statusHelpTarget = null;
      statusHelpTooltipEl.classList.remove("show", "pinned");
    }

    document.addEventListener("mouseover", (event) => {
      const target = event.target.closest?.("[data-help-title]");
      if (target && !statusHelpPinned) showStatusHelp(target, false);
    });
    document.addEventListener("mouseout", (event) => {
      if (statusHelpPinned) return;
      const target = event.target.closest?.("[data-help-title]");
      if (!target) return;
      const related = event.relatedTarget;
      if (!related || !target.contains(related)) hideStatusHelp(true);
    });
    document.addEventListener("focusin", (event) => {
      const target = event.target.closest?.("[data-help-title]");
      if (target && !statusHelpPinned) showStatusHelp(target, false);
    });
    document.addEventListener("focusout", () => { if (!statusHelpPinned) hideStatusHelp(true); });
    document.addEventListener("click", (event) => {
      const close = event.target.closest?.("#statusHelpClose");
      if (close) { event.stopPropagation(); hideStatusHelp(true); return; }
      const target = event.target.closest?.("[data-help-title]");
      if (!target) return;
      event.stopPropagation();
      statusHelpPinned = true;
      showStatusHelp(target, true);
    });
    statusHelpCloseEl.addEventListener("click", (event) => { event.stopPropagation(); hideStatusHelp(true); });
    window.addEventListener("resize", positionStatusHelp);
    playerTraitsEl.addEventListener("scroll", () => { if (statusHelpPinned) positionStatusHelp(); });

    function traitDisplayRows() {
      const rows = [];
      const push = (category, label, value) => rows.push({ category, label, value, desc: traitHelpDescription(label) });
      if (state.critChance > 0) push("red", "💥 치명타", `${pct(state.critChance)} · ×${state.critMultiplier.toFixed(1).replace('.0','')}`);
      if (traitLevel("A03")) push("red", "🔥 3연속 공격", `+${traitLevel("A03")*2}`);
      if (hasTrait("A04")) push("red", "⚔ 선제공격", "×2");
      if (traitLevel("A05")) push("red", "☠ 처형", `+${traitLevel("A05")*3}`);
      if (traitLevel("A06")) push("red", "🎯 집중 포화", `+${traitLevel("A06")*3}`);
      if (hasTrait("A07")) push("red", "🔥 몰아붙이기", "최대 +4");
      if (hasTrait("A08")) push("red", "↩ 반격", "×2");
      if (hasTrait("A09")) push("red", "💢 5번째 공격", "×2");

      if (state.shockChance > 0) push("blue", "🌪 충격파", `${pct(state.shockChance)} · +1칸`);
      if (traitLevel("P03")) push("blue", "💨 3연속 밀기", `+${traitLevel("P03")}칸`);
      if (hasTrait("P04")) push("blue", "➡ 첫 돌진", "+2칸");
      if (traitLevel("P05")) push("blue", "🌀 저항 관통", `${Math.min(65,20+(traitLevel("P05")-1)*15)}%`);
      if (hasTrait("P06")) push("blue", "🔨 저항 약화", "2회 후 -1");
      if (hasTrait("P07")) push("blue", "🌊 축적 충격", state.shockBuildupBonus>0?`+${pct(state.shockBuildupBonus)}`:"대기");
      if (hasTrait("P08")) push("blue", "➡ 강제 이동", "최소 1칸");
      if (hasTrait("P09")) push("blue", "⛰ 절벽 압박", "저항 -1");
      if (traitLevel("P10")) push("blue", "🌪 폭풍 연계", `${Math.min(70,25+(traitLevel("P10")-1)*15)}%`);

      if (state.clearHealAmount > 1) push("green", "💚 클리어 회복", `+${state.clearHealAmount}`);
      if (hasTrait("H03")) push("green", "🛡 보호막", state.stageShieldUsed?"사용됨":"1회");
      if (hasTrait("H04")) push("green", "⚓ 버티기", state.stageBraceUsed?"사용됨":"1회");
      if (traitLevel("H05")) push("green", "🛡 불굴", `${state.undyingCharges}회`);
      if (traitLevel("H06")) push("green", "💚 5연속 회복", `+${traitLevel("H06")}`);
      if (traitLevel("H07")) push("green", "➕ 응급 처치", `+${traitLevel("H07")*2}`);

      if (traitLevel("S01")) push("purple", "🟣 저항 파쇄", `+${traitLevel("S01")*2}/칸`);
      if (traitLevel("S02")) push("purple", "🟣 충격 폭발", `+${traitLevel("S02")*2}`);
      if (traitLevel("S03")) push("purple", "🟣 연쇄 충격", `+${traitLevel("S03")}칸`);
      if (traitLevel("S04")) push("purple", "🟣 강타", `+${traitLevel("S04")}칸`);
      if (hasTrait("S05")) push("purple", "🟣 과충전", state.overchargeBonus?`+${pct(state.overchargeBonus)}`:"대기");
      if (traitLevel("S06")) push("purple", "🟣 복수", `+${traitLevel("S06")*3}/+${traitLevel("S06")}칸`);
      if (traitLevel("S07")) push("purple", "🟣 배수진", `+${traitLevel("S07")*2}/+${traitLevel("S07")}칸`);
      if (traitLevel("S08")) push("purple", "🟣 재공격", `${Math.min(52,12+(traitLevel("S08")-1)*8)}%`);
      if (traitLevel("S09")) push("purple", "🟣 보물 선택지", `+${traitLevel("S09")} · 총 ${3+traitLevel("S09")}개`);
      if (traitLevel("S10")) push("purple", "🟣 보물 효과", `+${traitLevel("S10")*50}%`);
      if (traitLevel("S11")) push("purple", "🟣 역류", `+${traitLevel("S11")*2}/+${traitLevel("S11")*2}칸`);

      if (hasTrait("L01")) push("gold", "👑 초월의 일격", "피해 ×2");
      if (hasTrait("L02")) push("gold", "👑 불도저", "+2칸 / 저항 -1");

      for (const effect of state.tempEffects) {
        const suffix = effect.charges > 0 ? `${effect.charges}회` : "";
        let value = suffix;
        if (effect.type === "attack") value = `+${effect.amount} · ${suffix}`;
        if (effect.type === "push") value = `+${effect.amount}칸 · ${suffix}`;
        if (effect.type === "crit" || effect.type === "shock") value = `+${pct(effect.amount)} · ${suffix}`;
        push("orange", `🟠 ${effect.name}`, value);
      }
      if (state.extraTreasureNextStage > 0) push("orange", "🗺 다음 스테이지 보물", `+${state.extraTreasureNextStage}`);
      return rows;
    }

    function renderStats() {
      playerStatsEl.innerHTML = [
        `<span class="stat-pill core">⚔ 공격력 <b>${state.playerDamage}</b></span>`,
        `<span class="stat-pill core">💨 밀기 <b>${state.playerPush}</b></span>`
      ].join("");

      const rows = traitDisplayRows();
      traitCountEl.textContent = rows.length;
      playerTraitsEl.innerHTML = rows.length
        ? rows.map(row => `<div class="trait-row trait-${row.category}"><span>${row.label}</span><b>${row.value}</b></div>`).join("")
        : `<div class="trait-empty">아직 획득한 특성이 없습니다.</div>`;
      playerTraitsEl.querySelectorAll(".trait-row").forEach((el, index) => {
        const row = rows[index];
        setStatusHelpData(el, row.label.replace(/^[^\w가-힣]+\s*/, ""), row.desc);
      });

      const playerPills = playerStatsEl.querySelectorAll(".stat-pill");
      setStatusHelpData(playerPills[0], "공격력", "정답을 맞혔을 때 적 HP에 주는 기본 피해입니다.");
      setStatusHelpData(playerPills[1], "밀기", "정답을 맞혔을 때 적을 기본적으로 밀어내는 칸 수입니다.");
      setStatusHelpData(playerHpEl, "HP", "HP가 0이 되면 패배합니다. 최대 HP와 현재 HP를 하트로 표시합니다.");

      const enemyPills = [
        `<span class="stat-pill core">⚔ 공격력 <b>${state.enemyDamage}</b></span>`,
        `<span class="stat-pill core">💨 밀기 <b>${state.enemyPush}</b></span>`
      ];
      const enemyHelp = [
        ["적 공격력", "오답을 냈을 때 플레이어 HP에 주는 기본 피해입니다."],
        ["적 밀기", "오답을 냈을 때 플레이어를 밀어내는 칸 수입니다."]
      ];
      enemyPills.push(`<span class="stat-pill enemy-type type-${state.enemyType || "tank"}">${state.enemyTypeSymbol || "◆"} ${state.enemyTypeName || "적"}</span>`);
      enemyHelp.push([state.enemyTypeName || "적 유형", state.enemyTypeHelp || "적의 전투 유형입니다."]);
      const effectiveFlat = Math.max(0,state.enemyPushResistFlat-state.enemyFlatResistDebuff);
      if (effectiveFlat > 0) {
        enemyPills.push(`<span class="stat-pill resist">🛡 밀기 저항 <b>${effectiveFlat}칸</b> (항상)</span>`);
        enemyHelp.push(["고정 밀기 저항", "플레이어가 주는 밀기에서 표시된 칸 수만큼 항상 줄입니다."]);
      }
      if (state.enemyPushResistChance > 0) {
        enemyPills.push(`<span class="stat-pill resist">🛡 밀기 저항 <b>${pct(state.enemyPushResistChance)}</b> (발동 시 -1칸)</span>`);
        enemyHelp.push(["확률 밀기 저항", "표시된 확률로 발동하며, 발동하면 이번 공격에서 받는 밀기를 1칸 줄입니다."]);
      }
      if (state.enemyBoss) {
        const bossLabel = state.enemyFinalBoss ? "FINAL BOSS" : "BOSS";
        enemyPills.push(`<span class="stat-pill boss">${bossLabel}</span>`);
        enemyHelp.push([bossLabel, state.enemyFinalBoss ? "20스테이지의 최종 보스입니다. 일반 보스보다 더 크고 강력합니다." : "5스테이지마다 등장하는 강화 적입니다."]);
      }
      enemyStatsEl.innerHTML = enemyPills.join("");
      enemyStatsEl.querySelectorAll(".stat-pill").forEach((el, index) => {
        const info = enemyHelp[index];
        if (info) setStatusHelpData(el, info[0], info[1]);
      });
      setStatusHelpData(enemyHpEl, "적 HP", "적 HP가 0이 되면 낙사시키지 않아도 스테이지에서 승리합니다.");

      if (statusHelpPinned && statusHelpTarget && !document.body.contains(statusHelpTarget)) hideStatusHelp(true);
    }

    function renderArenaTiles() {
      arenaEl.querySelectorAll(".tile").forEach(el => el.remove());
      arenaEl.style.gridTemplateColumns = `repeat(${state.boardLength}, ${TILE_WIDTH}px)`;
      for (let i = 0; i < state.boardLength; i++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = String(i);
        const treasure = state.treasures.find(item => item.pos === i);
        if (treasure) {
          tile.classList.add(treasure.opened ? "treasure-opened" : "treasure-active");
          if (treasure.triggered) tile.classList.add("treasure-triggered");
          const mark = document.createElement("div");
          mark.className = "treasure-mark";
          tile.appendChild(mark);
        }
        arenaEl.insertBefore(tile, playerEl);
      }
      renderMinimap();
    }

    function arenaWorldWidth() {
      return state.boardLength * TILE_WIDTH + Math.max(0, state.boardLength - 1) * TILE_GAP;
    }

    function tileCenterForPos(pos) {
      return pos * (TILE_WIDTH + TILE_GAP) + TILE_WIDTH / 2;
    }

    function fighterLeftForPos(pos, width = FIGHTER_WIDTH) {
      const tileLeft = pos * (TILE_WIDTH + TILE_GAP);
      return tileLeft + (TILE_WIDTH - width) / 2;
    }

    function visualWidthForFighter(el) {
      return el === enemyEl ? (state.enemyVisualSize || FIGHTER_WIDTH) : FIGHTER_WIDTH;
    }

    const pixelActors = [];
    const pixelTypeMap = { tank: "tank", attacker: "goblin", pusher: "boar", heavy: "golem" };

    function setPixelAppearance(el, kind) {
      let actor = pixelActors.find(item => item.el === el);
      if (!actor) {
        actor = { el, art: null, kind: null, movingUntil: 0, attackStart: 0, attacking: false, lastFrame: -1 };
        pixelActors.push(actor);
        const observer = new MutationObserver(records => {
          for (const record of records) {
            if (record.attributeName !== "style") continue;
            const before = /(?:^|;)\s*left:\s*([^;]+)/.exec(record.oldValue || "")?.[1]?.trim();
            const after = el.style.left.trim();
            if (before && after && before !== after) actor.movingUntil = performance.now() + 300;
          }
        });
        observer.observe(el, { attributes: true, attributeOldValue: true, attributeFilter: ["style"] });
      }
      el.classList.add("pixel-fighter");
      el.dataset.pixelKind = kind;
      if (actor.kind === kind && actor.art?.parentNode === el) return;
      const art = document.createElement("span");
      art.className = "pixel-art";
      art.setAttribute("aria-hidden", "true");
      art.style.backgroundImage = `url("${PIXEL_SHEETS[kind] || PIXEL_SHEETS.tank}")`;
      el.replaceChildren(art);
      actor.art = art;
      actor.kind = kind;
      actor.lastFrame = -1;
      actor.movingUntil = 0;
      actor.attacking = false;
    }

    function animatePixelActors(now) {
      for (const actor of pixelActors) {
        const { el, art } = actor;
        if (!art?.isConnected) continue;
        const attacking = el.classList.contains("attack-left") || el.classList.contains("attack-right");
        if (attacking && !actor.attacking) actor.attackStart = now;
        actor.attacking = attacking;
        const defeated = el.classList.contains("fall") || el.classList.contains("defeated") || el.classList.contains("defeated-final");
        let frame = Math.floor(now / (actor.kind === "boss" || actor.kind === "finalBoss" ? 560 : 420)) % 2;
        let motion = "idle";
        if (defeated) { frame = 6; motion = "defeated"; }
        else if (el.classList.contains("hit")) { frame = 6 + Math.floor(now / 65) % 2; motion = "hit"; }
        else if (attacking) { frame = now - actor.attackStart < 75 ? 4 : 5; motion = "attack"; }
        else if (now < actor.movingUntil) { frame = 2 + Math.floor(now / 100) % 2; motion = "walk"; }
        if (frame !== actor.lastFrame) {
          art.style.backgroundPosition = `${frame * 100 / 7}% 0`;
          actor.lastFrame = frame;
        }
        if (el.dataset.pixelMotion !== motion) el.dataset.pixelMotion = motion;
      }
      requestAnimationFrame(animatePixelActors);
    }

    function applyEnemyVisual() {
      const classes = ["enemy-type-tank","enemy-type-attacker","enemy-type-pusher","enemy-type-heavy","enemy-boss","enemy-final-boss"];
      enemyEl.classList.remove(...classes);
      enemyEl.classList.add(`enemy-type-${state.enemyType || "tank"}`);
      if (state.enemyBoss) enemyEl.classList.add("enemy-boss");
      if (state.enemyFinalBoss) enemyEl.classList.add("enemy-final-boss");
      enemyEl.style.setProperty("--enemy-size", `${state.enemyVisualSize || FIGHTER_WIDTH}px`);
      setPixelAppearance(enemyEl, state.enemyFinalBoss ? "finalBoss" : state.enemyBoss ? "boss" : (pixelTypeMap[state.enemyType] || "tank"));
      enemyEl.setAttribute("aria-label", `${state.enemyFinalBoss ? "최종 보스" : state.enemyBoss ? "보스" : "적"} ${state.enemyTypeName || ""}`.trim());
    }

    function renderMinimap() {
      if (!minimapTrackEl) return;
      minimapTrackEl.style.gridTemplateColumns = `repeat(${state.boardLength}, minmax(0, 1fr))`;
      minimapTrackEl.innerHTML = "";

      for (let i = 0; i < state.boardLength; i++) {
        const cell = document.createElement("div");
        cell.className = "minimap-cell";
        const treasure = state.treasures.find(item => item.pos === i);
        if (treasure) {
          cell.classList.add("treasure");
          if (treasure.opened) cell.classList.add("opened");
        }

        if (i === state.playerPos) {
          const marker = document.createElement("span");
          marker.className = "minimap-marker player";
          marker.title = "PLAYER";
          cell.appendChild(marker);
        }
        if (i === state.enemyPos) {
          const marker = document.createElement("span");
          marker.className = "minimap-marker enemy";
          marker.title = "ENEMY";
          cell.appendChild(marker);
        }
        minimapTrackEl.appendChild(cell);
      }

    }

    function renderPositions() {
      playerEl.style.left = fighterLeftForPos(state.playerPos, FIGHTER_WIDTH) + "px";
      enemyEl.style.left = fighterLeftForPos(state.enemyPos, state.enemyVisualSize || FIGHTER_WIDTH) + "px";
      renderMinimap();
    }

    function cameraViewportWidth() {
      return arenaWrapEl.clientWidth;
    }

    function setCameraTransform(offsetX, scale, animate = true) {
      arenaCameraEl.style.transition = animate ? "transform .62s cubic-bezier(.2,.78,.2,1)" : "none";
      arenaEl.style.transition = animate ? "transform .68s cubic-bezier(.2,.78,.2,1)" : "none";
      arenaCameraEl.style.transform = `translate3d(${offsetX}px,0,0)`;
      arenaEl.style.transform = `scale(${scale})`;
    }

    function setOverviewCamera(animate = false) {
      const viewW = cameraViewportWidth();
      const worldW = arenaWorldWidth();
      const scale = Math.min(.9, Math.max(.08, (viewW - 38) / worldW));
      const offset = (viewW - worldW * scale) / 2;
      state.cameraMode = "overview";
      setCameraTransform(offset, scale, animate);
    }

    function battleCameraOffset() {
      const viewW = cameraViewportWidth();
      const worldW = arenaWorldWidth();
      if (worldW <= viewW - CAMERA_EDGE_PAD * 2) return (viewW - worldW) / 2;
      const p = Math.max(0, Math.min(state.boardLength - 1, state.playerPos));
      const e = Math.max(0, Math.min(state.boardLength - 1, state.enemyPos));
      const fightCenter = (tileCenterForPos(p) + tileCenterForPos(e)) / 2;
      const desired = viewW / 2 - fightCenter;
      const minX = viewW - worldW - CAMERA_EDGE_PAD;
      const maxX = CAMERA_EDGE_PAD;
      return Math.max(minX, Math.min(maxX, desired));
    }

    function followBattleCamera(animate = true) {
      state.cameraMode = "battle";
      setCameraTransform(battleCameraOffset(), 1, animate);
    }

    function cameraOffsetKeepingFighterVisible(pos, fighterWidth = FIGHTER_WIDTH) {
      const viewW = cameraViewportWidth();
      const worldW = arenaWorldWidth();
      if (worldW <= viewW - CAMERA_EDGE_PAD * 2) return (viewW - worldW) / 2;

      let offset = battleCameraOffset();
      const clampedPos = Math.max(0, Math.min(state.boardLength - 1, pos));
      const fighterLeft = fighterLeftForPos(clampedPos, fighterWidth);
      const fighterRight = fighterLeft + fighterWidth;
      const safeLeft = CAMERA_FIGHTER_SAFE_PAD;
      const safeRight = viewW - CAMERA_FIGHTER_SAFE_PAD;
      const screenLeft = fighterLeft + offset;
      const screenRight = fighterRight + offset;

      if (screenRight > safeRight) offset -= (screenRight - safeRight);
      if (screenLeft < safeLeft) offset += (safeLeft - screenLeft);

      const minX = viewW - worldW - CAMERA_EDGE_PAD;
      const maxX = CAMERA_EDGE_PAD;
      return Math.max(minX, Math.min(maxX, offset));
    }

    function keepFighterFullyVisible(pos, animate = true, fighterWidth = FIGHTER_WIDTH) {
      state.cameraMode = "battle";
      setCameraTransform(cameraOffsetKeepingFighterVisible(pos, fighterWidth), 1, animate);
    }

    function focusBattleEdge(side, animate = true) {
      const viewW = cameraViewportWidth();
      const worldW = arenaWorldWidth();
      let offset = battleCameraOffset();
      if (worldW > viewW - CAMERA_EDGE_PAD * 2) {
        offset = side === "right" ? viewW - worldW - CAMERA_EDGE_PAD : CAMERA_EDGE_PAD;
      }
      state.cameraMode = "battle";
      setCameraTransform(offset, 1, animate);
    }

    function focusFallenFighter(visualPos, side, animate = true) {
      const viewW = cameraViewportWidth();
      const worldW = arenaWorldWidth();

      // If the whole arena already fits on screen, keep the arena centered.
      // This prevents a sudden camera whip on short stages when someone falls.
      if (worldW <= viewW - CAMERA_EDGE_PAD * 2) {
        state.cameraMode = "battle";
        setCameraTransform((viewW - worldW) / 2, 1, false);
        return;
      }

      const fighterWidth = side === "right" ? (state.enemyVisualSize || FIGHTER_WIDTH) : FIGHTER_WIDTH;
      const fighterLeft = fighterLeftForPos(visualPos, fighterWidth);
      const fighterRight = fighterLeft + fighterWidth;
      let offset;
      if (side === "right") {
        offset = viewW - CAMERA_FIGHTER_SAFE_PAD - fighterRight;
      } else {
        offset = CAMERA_FIGHTER_SAFE_PAD - fighterLeft;
      }
      state.cameraMode = "battle";
      setCameraTransform(offset, 1, animate);
    }

    async function playStageCameraIntro(isRetry) {
      state.locked = true;
      setChoicesDisabled(true);
      stageMapIntroEl.textContent = `${state.enemyFinalBoss ? "FINAL BOSS · " : state.enemyBoss ? "BOSS · " : ""}STAGE ${state.stageIndex + 1} · ${state.enemyTypeName} · 맵 ${state.boardLength}칸`;

      setOverviewCamera(false);

      state.locked = false;
      setChoicesDisabled(false);
      setMessage("문제를 맞히면 공격하고 적을 밀어냅니다.");

    function tone(freq, duration, type = "sine", gain = 0.055, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      const start = ctx.currentTime + delay;
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.exponentialRampToValueAtTime(Math.min(.95, gain * SFX_GAIN_MULT), start + 0.012);
      amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(amp).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.02);
    }

    function ensureBgmMaster() {
      const ctx = getAudioContext();
      if (!ctx) return null;
      if (!bgmMaster) {
        bgmMaster = ctx.createGain();
        bgmMaster.gain.setValueAtTime(.92, ctx.currentTime);
        bgmMaster.connect(ctx.destination);
      }
      return bgmMaster;
    }

    function scheduleBgmTone(freq, start, duration, type, gain, detune = 0) {
      if (!freq || !bgmEnabled) return;
      const ctx = getAudioContext();
      const master = ensureBgmMaster();
      if (!ctx || !master) return;
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      if (detune) osc.detune.setValueAtTime(detune, start);
      amp.gain.setValueAtTime(.0001, start);
      amp.gain.exponentialRampToValueAtTime(gain, start + .012);
      amp.gain.exponentialRampToValueAtTime(.0001, start + Math.max(.035, duration));
      osc.connect(amp).connect(master);
      osc.start(start);
      osc.stop(start + duration + .03);
    }

    function scheduleBgmStep(track, step, start) {
      const eighth = 60 / track.bpm / 2;
      // One continuous normal-stage theme per five-stage chapter.
      // Stages 1-4 / 6-9 / 11-14 / 16-19 keep the same musical clock and melody.
      // Only the fifth stage switches to that chapter's boss arrangement.
      const melodySource = track.melody;
      const melody = melodySource[step % melodySource.length];
      const harmony = track.harmony ? track.harmony[step % track.harmony.length] : 0;
      const bass = track.bass[step % track.bass.length];
      if (melody) scheduleBgmTone(melody, start, eighth * .76, track.type, track.melodyGain);
      if (harmony) scheduleBgmTone(harmony, start, eighth * .92, track.harmonyType || "triangle", track.harmonyGain || .008);
      if (bass) scheduleBgmTone(bass, start, eighth * 1.55, track.bassType || "triangle", track.bassGain);

      if (step % 2 === 0) {
        scheduleBgmTone(track.pulseFreq || 72, start, .06, "sine", track.pulseGain);
      }
      if (track.accentFreq && step % 4 === 2) {
        scheduleBgmTone(track.accentFreq, start, .04, track.accentType || "square", track.accentGain || .003);
      }
    }

    function bgmScheduler() {
      if (!bgmEnabled || !bgmTrack) return;
      const ctx = getAudioContext();
      const track = BGM_TRACKS[bgmTrack];
      if (!ctx || !track) return;
      const eighth = 60 / track.bpm / 2;
      while (bgmNextTime < ctx.currentTime + BGM_SCHEDULE_AHEAD) {
        scheduleBgmStep(track, bgmStep, bgmNextTime);
        bgmNextTime += eighth;
        bgmStep = (bgmStep + 1) % 16;
      }
    }

    function stopBgm(clearTrack = false) {
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
      if (clearTrack) bgmTrack = null;
    }

    function setBgmTrack(trackName, forceRestart = false) {
      if (!BGM_TRACKS[trackName]) return;
      bgmDesiredTrack = trackName;
      if (!bgmEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      ensureBgmMaster();

      // Do not restart the same song between normal stages, reward screens, or treasure screens.
      if (!forceRestart && bgmTrack === trackName && bgmTimer) return;

      bgmTrack = trackName;
      bgmStep = 0;
      bgmNextTime = ctx.currentTime + .04;
      if (!bgmTimer) bgmTimer = setInterval(bgmScheduler, BGM_LOOKAHEAD_MS);
      bgmScheduler();
    }

    function unlockAudioAndPlay(trackName = null) {
      if (!bgmEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const target = trackName || bgmDesiredTrack || "menu";
      const finish = () => {
        audioUnlocked = ctx.state === "running";
        setBgmTrack(target);
        updateBgmButton();
      };
      if (ctx.state === "suspended") {
        const resumed = ctx.resume();
        if (resumed && typeof resumed.then === "function") resumed.then(finish).catch(() => {});
        else finish();
      } else finish();
    }

    function updateBgmForStage() {
      if (!GAME_MODE || state.gameOver) return;
      const stageNumber = state.stageIndex + 1;
      const theme = getStageTheme(stageNumber);
      if (state.enemyFinalBoss) setBgmTrack("final");
      else if (state.enemyBoss) setBgmTrack(theme.bossTrack);
      else setBgmTrack(theme.battleTrack);
    }

    function updateBgmButton() {
      const waitingForClick = bgmEnabled && audioCtx && audioCtx.state !== "running";
      bgmToggleButton.textContent = !bgmEnabled ? "♫ BGM OFF" : waitingForClick ? "♫ BGM 시작" : "♫ BGM ON";
      bgmToggleButton.classList.toggle("off", !bgmEnabled);
      bgmToggleButton.setAttribute("aria-pressed", String(bgmEnabled));
    }

    function toggleBgm() {
      // If autoplay was blocked, the first BGM-button click unlocks audio instead of turning BGM off.
      if (bgmEnabled && (!audioCtx || audioCtx.state !== "running")) {
        unlockAudioAndPlay(startOverlay.classList.contains("show") ? "menu" : bgmDesiredTrack);
        return;
      }
      bgmEnabled = !bgmEnabled;
      updateBgmButton();
      if (!bgmEnabled) {
        stopBgm(false);
        return;
      }
      if (startOverlay.classList.contains("show")) unlockAudioAndPlay("menu");
      else if (!resultOverlay.classList.contains("show") && GAME_MODE) {
        updateBgmForStage();
        unlockAudioAndPlay(bgmDesiredTrack);
      }
    }

    function noiseBurst(duration = .07, gain = .04, frequency = 1800, q = .7, delay = 0) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) {
        const env = 1 - i / length;
        data[i] = (Math.random() * 2 - 1) * env;
      }
      const source = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const amp = ctx.createGain();
      const start = ctx.currentTime + delay;
      source.buffer = buffer;
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(frequency, start);
      filter.Q.setValueAtTime(q, start);
      amp.gain.setValueAtTime(.0001, start);
      amp.gain.exponentialRampToValueAtTime(Math.min(.95, gain * SFX_GAIN_MULT), start + .008);
      amp.gain.exponentialRampToValueAtTime(.0001, start + duration);
      source.connect(filter).connect(amp).connect(ctx.destination);
      source.start(start);
      source.stop(start + duration + .02);
    }

    function flashAnswer(text, type) {
      const el = document.createElement("div");
      el.className = `answer-flash ${type}`;
      el.textContent = text;
      arenaWrapEl.appendChild(el);
      setTimeout(() => el.remove(), 620);
    }

    function localRectInArenaWrap(targetEl) {
      const arenaRect = arenaWrapEl.getBoundingClientRect();
      const targetRect = targetEl.getBoundingClientRect();
      const scaleX = arenaWrapEl.offsetWidth ? arenaRect.width / arenaWrapEl.offsetWidth : 1;
      const scaleY = arenaWrapEl.offsetHeight ? arenaRect.height / arenaWrapEl.offsetHeight : 1;
      return {
        left: (targetRect.left - arenaRect.left) / (scaleX || 1),
        top: (targetRect.top - arenaRect.top) / (scaleY || 1),
        width: targetRect.width / (scaleX || 1),
        height: targetRect.height / (scaleY || 1)
      };
    }

    function showImpact(targetEl, kind = "basic") {
      const targetRect = localRectInArenaWrap(targetEl);
      const el = document.createElement("div");
      el.className = "impact" + (kind === "strong" ? " strong" : "");
      el.textContent = "💥";
      const size = kind === "strong" ? 96 : 74;
      el.style.left = `${targetRect.left + targetRect.width / 2 - size / 2}px`;
      el.style.top = `${targetRect.top + targetRect.height / 2 - size / 2 - 4}px`;
      arenaWrapEl.appendChild(el);
      setTimeout(() => el.remove(), 380);
    }

    const floatingTextStacks = new WeakMap();

    function layoutFloatingTextStack(targetEl) {
      const stack=(floatingTextStacks.get(targetEl)||[]).filter(el=>el.isConnected);
      floatingTextStacks.set(targetEl,stack);
      if (!stack.length) return;
      const targetRect=localRectInArenaWrap(targetEl);
      const baseLeft=targetRect.left+targetRect.width/2;
      const baseTop=targetRect.top-10;
      const gap=38;
      // Newest effect stays closest to the fighter; older effects move upward.
      [...stack].reverse().forEach((el,index)=>{
        const row=Math.min(index,5);
        const overflow=index>5 ? index-5 : 0;
        const side=overflow ? (overflow%2 ? -1 : 1) : 0;
        el.style.left=`${baseLeft + side*150}px`;
        el.style.top=`${Math.max(8,baseTop-row*gap)}px`;
      });
    }

    function showFloatingText(targetEl, text, type = "damage") {
      const el = document.createElement("div");
      el.className = "floating-number" + (type === "strong" ? " strong" : type === "push" ? " push-text" : type === "crit" ? " crit-text" : type === "resist" ? " resist-text" : type === "special" ? " special-text" : type === "legend" ? " legend-text" : "");
      el.textContent = text;
      arenaWrapEl.appendChild(el);
      const stack=(floatingTextStacks.get(targetEl)||[]).filter(item=>item.isConnected);
      stack.push(el);
      floatingTextStacks.set(targetEl,stack);
      layoutFloatingTextStack(targetEl);
      const lifetime = type === "push" || type === "resist" ? 900 : 760;
      setTimeout(() => {
        el.remove();
        layoutFloatingTextStack(targetEl);
      }, lifetime);
    }

    function showPushWave(targetEl) {
      const targetRect = localRectInArenaWrap(targetEl);
      const el = document.createElement("div");
      el.className = "push-wave";
      el.style.left = `${targetRect.left + targetRect.width / 2 - 42}px`;
      el.style.top = `${targetRect.top + targetRect.height / 2 - 42}px`;
      arenaWrapEl.appendChild(el);
      setTimeout(() => el.remove(), 520);
    }

    function shakeArena() {
      arenaWrapEl.classList.remove("shake");
