    function showEnemyDefeatBurst(isFinal = false) {
      // enemyEl is inside the horizontally translated camera, while the burst is drawn
      // in arenaWrap. Convert screen coordinates back into arenaWrap local coordinates
      // so outer 1920x1080 canvas scaling cannot shift the burst toward the player.
      const enemyRect = localRectInArenaWrap(enemyEl);
      const cx = enemyRect.left + enemyRect.width / 2;
      const cy = enemyRect.top + enemyRect.height / 2;

      const ring = document.createElement("div");
      ring.className = `enemy-defeat-ring${isFinal ? " final" : ""}`;
      ring.style.left = `${cx}px`;
      ring.style.top = `${cy}px`;
      arenaWrapEl.appendChild(ring);
      setTimeout(() => ring.remove(), isFinal ? 940 : 680);

      const count = isFinal ? 14 : (state.enemyBoss ? 10 : 7);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i / count) + (i % 2 ? .16 : 0);
        const distance = (isFinal ? 105 : state.enemyBoss ? 82 : 62) + (i % 3) * 9;
        const particle = document.createElement("div");
        particle.className = `enemy-defeat-particle${isFinal ? " final" : ""}`;
        particle.style.left = `${cx}px`;
        particle.style.top = `${cy}px`;
        particle.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        particle.style.setProperty("--rot", `${90 + i * 37}deg`);
        arenaWrapEl.appendChild(particle);
        setTimeout(() => particle.remove(), isFinal ? 900 : 650);
      }
    }

    async function playEnemyDefeatAnimation() {
      const isFinal = Boolean(state.enemyFinalBoss);
      enemyEl.classList.remove("hit", "attack-left", "attack-right", "fall", "defeated", "defeated-final");

    function hitFighter(el) { el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 180); }
    function pulseHp(el) { el.classList.remove("damage"); void el.offsetWidth; el.classList.add("damage"); setTimeout(() => el.classList.remove("damage"), 340); }
    function pulseHeal(el) { el.classList.remove("heal"); void el.offsetWidth; el.classList.add("heal"); setTimeout(() => el.classList.remove("heal"), 720); }
    function setFighterPosition(el, pos) { el.style.left = fighterLeftForPos(pos, visualWidthForFighter(el)) + "px"; }

    function showStageHealBurst(amount) {

    async function applyStageClearHeal() {
      const before = state.playerHp;
      state.playerHp = Math.min(state.playerMaxHp, state.playerHp + state.clearHealAmount);
      const healed = state.playerHp - before;
      renderHp(playerHpEl, state.playerHp, state.playerMaxHp);
      renderStats();
      pulseHeal(playerHpEl);
      showStageHealBurst(healed);
      playStageHealSound();
      setMessage(healed > 0 ? `스테이지 클리어! HP가 ${healed} 회복되었습니다.` : "스테이지 클리어! HP가 가득 차 있습니다.", "good");
      await sleep(900);
    }

    function getComboExtraPush() {
      const level = traitLevel("P03");
      return level > 0 && state.correctStreak > 0 && state.correctStreak % 3 === 0 ? level : 0;
    }

    function getComboExtraDamage() {
      const level = traitLevel("A03");
      return level > 0 && state.correctStreak > 0 && state.correctStreak % 3 === 0 ? level * 2 : 0;
    }

    function treasureAmp() { return 1 + traitLevel("S10") * .5; }
    function ampTreasureNumber(value) { return Math.max(1, Math.ceil(value * treasureAmp())); }
    function ampTreasureChance(value) { return Math.min(1, value * treasureAmp()); }

    function addTempEffect(type, amount, charges, name) {
      state.tempEffects.push({ type, amount, charges, name });
    }
    function tempAmount(type) { return state.tempEffects.filter(e=>e.type===type && e.charges>0).reduce((s,e)=>s+e.amount,0); }
    function hasTemp(type) { return state.tempEffects.some(e=>e.type===type && e.charges>0); }
    function consumeTempType(type) {
      const effect = state.tempEffects.find(e=>e.type===type && e.charges>0);
      if (!effect) return false;
      effect.charges -= 1;
      state.tempEffects = state.tempEffects.filter(e=>e.charges>0);
      return true;
    }
    function consumeCorrectTempEffects() {
      for (const e of state.tempEffects) {
        if (["attack","push","crit","shock"].includes(e.type) && e.charges>0) e.charges -= 1;
      }
      state.tempEffects = state.tempEffects.filter(e=>e.charges>0);
    }

    function pushPenetrationChance() {
      const level=traitLevel("P05");
      return level ? Math.min(.65,.20+(level-1)*.15) : 0;
    }
    function stormChainChance() {
      const level=traitLevel("P10");
      return level ? Math.min(.70,.25+(level-1)*.15) : 0;
    }
    function reattackChance() {
      const level=traitLevel("S08");
      return level ? Math.min(.52,.12+(level-1)*.08) : 0;
    }

    function resolveEnemyPushResistance(rawPush, ignoreAll = false, extraFlatIgnore = 0) {
      if (ignoreAll) return { actualPush: rawPush, flatReduction:0, chanceReduction:0, ignored:true };
      const baseFlat = Math.max(0,(state.enemyPushResistFlat||0)-state.enemyFlatResistDebuff);
      const flatAfterIgnore = Math.max(0, baseFlat - extraFlatIgnore);
      const flat = Math.min(rawPush, flatAfterIgnore);
      let remaining = Math.max(0, rawPush - flat);
      const chanceTriggered = remaining > 0 && state.enemyPushResistChance > 0 && Math.random() < state.enemyPushResistChance;
      const chanceReduction = chanceTriggered ? 1 : 0;
      remaining = Math.max(0, remaining - chanceReduction);
      return { actualPush: remaining, flatReduction: flat, chanceReduction, ignored:false };
    }

    async function resolveCorrectAttack() {
      const isFirstCorrect = state.stageCorrectAttacks === 0;
      const nextCorrectNumber = state.correctAttackCount + 1;
      const enemyLowHp = state.enemyHp <= state.enemyMaxHp * .30;
      const playerNearFall = state.playerPos + 1 <= 2;
      const enemyToFall = state.boardLength - state.enemyPos;
      const comboPush = getComboExtraPush();
      const comboDamage = getComboExtraDamage();
      const tempAttack = tempAmount("attack");
      const tempPush = tempAmount("push");
      const tempCrit = tempAmount("crit");
      const tempShock = tempAmount("shock");
      const revengeLevel = state.revengeReady ? traitLevel("S06") : 0;
      const backflowLevel = state.backflowReady ? traitLevel("S11") : 0;

      let baseDamage = state.playerDamage + tempAttack + comboDamage;
      if (enemyLowHp) baseDamage += traitLevel("A05") * 3;
      if (hasTrait("A07")) baseDamage += Math.min(4, Math.max(0,state.correctStreak));
      if (revengeLevel) baseDamage += revengeLevel * 3;
      if (backflowLevel) baseDamage += backflowLevel * 2;
      if (playerNearFall) baseDamage += traitLevel("S07") * 2;

      let effectiveCritChance = Math.min(.95, state.critChance + tempCrit + state.overchargeBonus);
      const critTriggered = effectiveCritChance > 0 && Math.random() < effectiveCritChance;
      let damageMultiplier = 1;
      if (critTriggered) damageMultiplier *= state.critMultiplier;
      if (isFirstCorrect && hasTrait("A04")) damageMultiplier *= 2;
      if (state.counterReady && hasTrait("A08")) damageMultiplier *= 2;
      if (hasTrait("A09") && nextCorrectNumber % 5 === 0) damageMultiplier *= 2;
      if (hasTrait("L01")) damageMultiplier *= 2;

      const effectiveShockChance = Math.min(.95, state.shockChance + tempShock + state.shockBuildupBonus);
      const shockTriggered = effectiveShockChance > 0 && Math.random() < effectiveShockChance;
      let shockPush = shockTriggered ? 1 : 0;
      let stormPush = 0;
      if (shockTriggered && traitLevel("P10") && Math.random() < stormChainChance()) stormPush = 1;

      let bonusPush = tempPush + comboPush + shockPush + stormPush;
      if (isFirstCorrect && hasTrait("P04")) bonusPush += 2;
      if (critTriggered) bonusPush += traitLevel("S03");
      if (revengeLevel) bonusPush += revengeLevel;
      if (backflowLevel) bonusPush += backflowLevel * 2;
      if (playerNearFall) bonusPush += traitLevel("S07");

      let preSpecialDamage = Math.max(0, Math.round(baseDamage * damageMultiplier));
      if (preSpecialDamage >= 6) bonusPush += traitLevel("S04");
      const extraPushOccurred = bonusPush > 0;
      if (extraPushOccurred) preSpecialDamage += traitLevel("S02") * 2;

      const rawPushDistance = Math.max(0,state.playerPush + bonusPush);
      const penetration = traitLevel("P05") > 0 && Math.random() < pushPenetrationChance();
      let flatIgnore = hasTrait("L02") ? 1 : 0;
      if (hasTrait("P09") && enemyToFall <= 3) flatIgnore += 1;
      const resist = resolveEnemyPushResistance(rawPushDistance, penetration, flatIgnore);
      let pushDistance = resist.actualPush;
      if (hasTrait("P08") && rawPushDistance >= 3 && pushDistance === 0) pushDistance = 1;
      const blockedPush = resist.flatReduction + resist.chanceReduction;

      let damage = preSpecialDamage;
      if (blockedPush > 0) damage += blockedPush * traitLevel("S01") * 2;
      if (pushDistance === 0) damage += traitLevel("A06") * 3;

      // Stateful proc updates happen once per correct answer.
      if (hasTrait("S05")) state.overchargeBonus = critTriggered ? 0 : Math.min(.60,state.overchargeBonus+.10);
      if (hasTrait("P07")) state.shockBuildupBonus = shockTriggered ? 0 : Math.min(.60,state.shockBuildupBonus+.10);
      state.counterReady = false;
      state.revengeReady = false;
      state.backflowReady = false;
      state.stageCorrectAttacks += 1;
      state.correctAttackCount += 1;
      consumeCorrectTempEffects();
      renderStats();

      playerEl.classList.add("attack-right");
      await sleep(105);

      if (damage > 1 || critTriggered) playStrongHitSound(); else playHitSound();
      if (critTriggered) setTimeout(playCriticalSound, 28);
      showImpact(enemyEl, damage > 1 ? "strong" : "basic");
      showFloatingText(enemyEl, `-${damage}`, damage > 1 ? "strong" : "damage");
      if (critTriggered) setTimeout(()=>showFloatingText(enemyEl, `CRITICAL ×${state.critMultiplier.toFixed(1).replace('.0','')}`, "crit"),70);
      if (comboDamage>0) setTimeout(()=>showFloatingText(enemyEl,`3연속 공격 +${comboDamage}`,"crit"),120);
      if (blockedPush>0 && traitLevel("S01")) setTimeout(()=>showFloatingText(enemyEl,`저항 파쇄 +${blockedPush*traitLevel("S01")*2}`,"special"),165);
      if (extraPushOccurred && traitLevel("S02")) setTimeout(()=>showFloatingText(enemyEl,`충격 폭발 +${traitLevel("S02")*2}`,"special"),210);
      if (hasTrait("L01")) setTimeout(()=>showFloatingText(enemyEl,"초월의 일격 ×2","legend"),250);
      shakeArena(); hitFighter(enemyEl);

      state.enemyHp = Math.max(0,state.enemyHp-damage);
      renderHp(enemyHpEl,state.enemyHp,state.enemyMaxHp); pulseHp(enemyHpEl);

      const reattack = traitLevel("S08")>0 && Math.random()<reattackChance();
      if (reattack && state.enemyHp>0) {
        await sleep(145);
        playStrongHitSound();
        showImpact(enemyEl,"strong");
        showFloatingText(enemyEl,`재공격 -${damage}`,"special");
        state.enemyHp=Math.max(0,state.enemyHp-damage);
        renderHp(enemyHpEl,state.enemyHp,state.enemyMaxHp); pulseHp(enemyHpEl);
      }

      // HP defeat wins immediately at the enemy's current tile. Do not continue pushing a defeated enemy.
      if (state.enemyHp <= 0) {
        playerEl.classList.remove("attack-right");
        keepFighterFullyVisible(state.enemyPos, true, state.enemyVisualSize || FIGHTER_WIDTH);
        await sleep(180);
        return;
      }

      if (bonusPush > 0) {
        await sleep(85); playPushSound(Math.max(1, bonusPush)); showPushWave(enemyEl);
        const parts=[];
        if (comboPush) parts.push(`3연속 +${comboPush}`);
        if (shockPush) parts.push("충격파 +1");
        if (stormPush) parts.push("폭풍 +1");
        if (critTriggered && traitLevel("S03")) parts.push(`연쇄 +${traitLevel("S03")}`);
        if (traitLevel("S04") && preSpecialDamage>=6) parts.push(`강타 +${traitLevel("S04")}`);
        if (parts.length) showFloatingText(enemyEl,parts.join(" · "),"push");
      }

      const totalResist=blockedPush;
      if (pushDistance > 0 && bonusPush <= 0) setTimeout(() => playPushSound(pushDistance), 30);
      if (penetration && (state.enemyPushResistFlat>0 || state.enemyPushResistChance>0)) {
        await sleep(55); showFloatingText(enemyEl,"🌀 밀기 저항 관통!","push");
      } else if (totalResist>0) {
        await sleep(70); playResistSound();
        showFloatingText(enemyEl,`🛡 밀기 저항! ${rawPushDistance}칸 → ${pushDistance}칸`,"resist");
        state.enemyResistSuccesses += 1;
        if (hasTrait("P06") && state.enemyResistSuccesses >= 2 && state.enemyFlatResistDebuff < 1 && state.enemyPushResistFlat>0) {
          state.enemyFlatResistDebuff=1;
          setTimeout(()=>showFloatingText(enemyEl,"🔨 저항 약화! 고정 저항 -1","special"),120);
          renderStats();
        }
      }

      state.enemyPos += pushDistance;
      renderMinimap();
      const enemyVisualPos=state.enemyPos>=state.boardLength?state.boardLength:state.enemyPos;
      setFighterPosition(enemyEl,enemyVisualPos);
      if (state.enemyPos>=state.boardLength) focusFallenFighter(enemyVisualPos,"right",true); else keepFighterFullyVisible(enemyVisualPos,true,state.enemyVisualSize || FIGHTER_WIDTH);
      await sleep(state.enemyPos>=state.boardLength?650:(bonusPush>0||rawPushDistance>1||totalResist>0?380:280));
      playerEl.classList.remove("attack-right");

      if (traitLevel("H06")>0 && state.correctStreak>0 && state.correctStreak%5===0) {
        const before=state.playerHp; state.playerHp=Math.min(state.playerMaxHp,state.playerHp+traitLevel("H06"));
        const healed=state.playerHp-before;
        if (healed>0) { renderHp(playerHpEl,state.playerHp,state.playerMaxHp); pulseHeal(playerHpEl); showFloatingText(playerEl,`정답 재생 +${healed} HP`,"special"); }
      }

      if (state.enemyPos>=state.boardLength) return;
      state.playerPos += pushDistance;
      renderMinimap(); setFighterPosition(playerEl,state.playerPos);
      await sleep(110); followBattleCamera(true); await sleep(320);
    }

    async function resolveWrongAttack() {
      let damage=state.enemyDamage;
      let pushDistance=state.enemyPush;
      let hpBlocked=false, pushBlocked=false;

      if (hasTemp("hpShield")) { consumeTempType("hpShield"); damage=0; hpBlocked=true; }
      else if (hasTrait("H03") && !state.stageShieldUsed) { state.stageShieldUsed=true; damage=0; hpBlocked=true; }

      if (hasTemp("pushShield")) { consumeTempType("pushShield"); pushDistance=0; pushBlocked=true; }
      else if (hasTrait("H04") && !state.stageBraceUsed) { state.stageBraceUsed=true; pushDistance=0; pushBlocked=true; }

      enemyEl.classList.add("attack-left");
      await sleep(105);
      if (damage>1) playStrongHitSound(); else if (damage>0) playHitSound();
      if (damage>0) { showImpact(playerEl,damage>1?"strong":"basic"); showFloatingText(playerEl,`-${damage}`,damage>1?"strong":"damage"); }
      if (hpBlocked) showFloatingText(playerEl,"🛡 피해 방어!","special");
      if (pushBlocked) setTimeout(()=>showFloatingText(playerEl,"⚓ 밀기 방어!","special"),70);
      if (pushDistance>1) setTimeout(()=>{playPushSound(pushDistance);showPushWave(playerEl);showFloatingText(playerEl,`적 밀기 ${pushDistance}칸`,`push`);},70);
      if (damage>0 || pushDistance>0) { shakeArena(); hitFighter(playerEl); }

      state.playerHp=Math.max(0,state.playerHp-damage);
      if (state.playerHp<=0 && state.undyingCharges>0) {
        state.undyingCharges-=1; state.playerHp=1;
        setTimeout(()=>showFloatingText(playerEl,"🛡 불굴! HP 1","legend"),90);
      }
      renderHp(playerHpEl,state.playerHp,state.playerMaxHp); renderStats(); pulseHp(playerHpEl);

      state.playerPos -= pushDistance;
      renderMinimap();
      const playerVisualPos=state.playerPos<0?-1:state.playerPos;
      setFighterPosition(playerEl,playerVisualPos);
      if (state.playerPos<0) focusFallenFighter(playerVisualPos,"left",true); else keepFighterFullyVisible(playerVisualPos,true);
      await sleep(state.playerPos<0?650:(pushDistance>1?360:280));
      enemyEl.classList.remove("attack-left");

      if (hasTrait("A08")) state.counterReady=true;
      if (traitLevel("S06") && (damage>0 || pushDistance>0)) state.revengeReady=true;
      if (traitLevel("S11") && pushDistance>=2) state.backflowReady=true;
      renderStats();

      if (state.playerPos<0) return;
      state.enemyPos -= pushDistance;
      renderMinimap(); setFighterPosition(enemyEl,state.enemyPos);
      await sleep(110); followBattleCamera(true); await sleep(320);
    }

    function treasureCountForBoard(boardLength) {
      if (boardLength <= 8) return 1;
      if (boardLength <= 12) return 2;
      if (boardLength <= 16) return Math.random() < 0.35 ? 3 : 2;
      if (boardLength <= 20) return Math.random() < 0.60 ? 3 : 2;
      return Math.random() < 0.45 ? 4 : 3;
    }

    function chooseTreasurePositions() {
      const targetCount = Math.min(state.boardLength - 2, treasureCountForBoard(state.boardLength) + state.extraTreasureNextStage);
      const rightEdge = state.boardLength - 1;
      const maxTreasurePos = rightEdge - 1;
      const allCandidates = [];
      for (let i = 0; i <= maxTreasurePos; i++) {
        if (i === state.playerPos) continue;
        allCandidates.push(i);
      }

      const chosen = [];
      // 맵을 구간으로 나눈 뒤 각 구간에서 랜덤으로 뽑아 긴 맵에서 상자가 한쪽에 몰리지 않게 한다.
      for (let zone = 0; zone < targetCount; zone++) {
        const zoneStart = Math.floor((maxTreasurePos + 1) * zone / targetCount);
        const zoneEnd = Math.floor((maxTreasurePos + 1) * (zone + 1) / targetCount) - 1;
        let pool = allCandidates.filter(pos =>
          pos >= zoneStart && pos <= zoneEnd &&
          !chosen.includes(pos) &&
          chosen.every(other => Math.abs(other - pos) >= 2)
        );

        if (pool.length === 0) {
          pool = allCandidates.filter(pos =>
            !chosen.includes(pos) &&
            chosen.every(other => Math.abs(other - pos) >= 2)
          );
        }
        if (pool.length === 0) pool = allCandidates.filter(pos => !chosen.includes(pos));
        if (pool.length === 0) break;

        chosen.push(pool[Math.floor(Math.random() * pool.length)]);
      }

      return chosen
        .sort((a, b) => a - b)
        .map(pos => ({ pos, opened: false, triggered: false }));
    }

    function treasureTileElement(treasure) {
      return arenaEl.querySelector(`.tile[data-index="${treasure.pos}"]`);
    }

    function weightedSample(items, count, getWeight) {
      const pool=[...items]; const picked=[];
      while (pool.length && picked.length<count) {
        const weights=pool.map(x=>Math.max(0,getWeight(x)));
        const total=weights.reduce((a,b)=>a+b,0);
        if (total<=0) break;
        let r=Math.random()*total, idx=0;
        for (;idx<pool.length;idx++){ r-=weights[idx]; if(r<=0) break; }
        picked.push(pool.splice(Math.min(idx,pool.length-1),1)[0]);
      }
      return picked;
    }

    function pickSmallRewards() {
      const count=Math.min(6,3+traitLevel("S09"));
      const pool=smallRewards.filter(r=>!r.available || r.available());
      return weightedSample(pool,count,r=>r.weight||RARITY_WEIGHT[r.rarity]||50);
    }

    function shortRewardDesc(reward) {
      if (reward.id === "T01") return "HP +2";
      if (reward.id === "T02") return "HP +4";
      if (reward.id === "T03") return `다음 정답 공격력 +${ampTreasureNumber(2)}`;

      if (reward.id === "T06") return `다음 3회 충격파 +${pct(ampTreasureChance(.35))}`;
      if (reward.id === "T07") return `다음 3회 치명타 +${pct(ampTreasureChance(.40))}`;
      if (reward.id === "T08") return "다음 오답 HP 피해 무효";
      if (reward.id === "T09") return "다음 오답 밀기 무효";
      if (reward.id === "T10") return `다음 스테이지 보물 +${ampTreasureNumber(1)}개`;
      return SHORT_REWARD_DESCS[reward.id] || (typeof reward.desc === "function" ? reward.desc() : reward.desc);
    }

    function rewardCardHtml(reward, isTreasure=false) {
      const rarity=RARITY_LABEL[reward.rarity]||"";
      const category=CATEGORY_LABEL[reward.category]||"";

      return `<span class="card-meta"><em>${category}</em><em>${rarity}</em></span><strong>${reward.category==="gold"?"👑 ":""}${reward.name}</strong><span class="card-desc">${desc}</span>`;

        cards.forEach(reward=>{

    async function maybeOpenTreasure() {
      const treasure = state.treasures.find(item => item.pos === state.playerPos && !item.opened && !item.triggered);
      if (!treasure) return;
      treasure.triggered = true;
      const tile = treasureTileElement(treasure);
      if (tile) tile.classList.add("treasure-triggered");
      renderMinimap();
      playChestOpenSound();
      setMessage("보물 타일 도착! 작은 보상을 선택하세요.", "good");
      await sleep(260);
      await showTreasureSelection(treasure);
    }

    function pickQuestion() {
      if (!state.remainingQuestionIndexes.length) {
        // The tiny built-in test set may run out during a 20-stage test, so only the fallback set refills.
        // Real questions.js data never refills in standard mode: once answered correctly, that question is gone for the run.
        if (GAME_MODE === "standard" && !USING_EXTERNAL_QUESTION_BANK) {
          setQuestionPoolForGrade(SELECTED_GRADE);
        } else if (!advanceEndlessQuestionGrade()) {
          state.currentQuestion = null;
          state.currentQuestionIndex = -1;
          questionEl.textContent = "이 학년의 모든 문제를 맞혔습니다!";
          choicesEl.innerHTML = "";
          state.locked = true;
          return;
        }
      }

      // No cooldown: every unanswered question is immediately eligible again.
      // Correct answers are removed from this pool; wrong answers stay in it.
      const pool = state.remainingQuestionIndexes;
      const idx = pool[Math.floor(Math.random() * pool.length)];
      state.currentQuestionIndex = idx;
      state.currentQuestion = ACTIVE_QUESTION_BANK[idx];
      renderQuestion();
    }

    function renderQuestion() {
      const q = state.currentQuestion;
      questionEl.textContent = q.question;
      choicesEl.innerHTML = "";
      q.choices.forEach((choice, idx) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = choice;
        button.addEventListener("click", () => answerQuestion(idx, button));
        choicesEl.appendChild(button);
      });
    }

    function setChoicesDisabled(disabled) { [...choicesEl.querySelectorAll("button")].forEach(btn => btn.disabled = disabled); }

    async function answerQuestion(selectedIndex, selectedButton) {
      if (state.locked || state.gameOver) return;
      state.locked = true;
      setChoicesDisabled(true);
      state.total += 1;

      const correctIndex = state.currentQuestion.answer;
      const buttons = [...choicesEl.querySelectorAll("button")];

      if (selectedIndex === correctIndex) {
        state.correct += 1;
        state.correctStreak += 1;
        markCurrentQuestionCorrect();
        selectedButton.classList.add("correct");
        playCorrectSound();
        flashAnswer("✓ 정답!", "good");
        setMessage("정답! 공격 성공!", "good");
        await sleep(180);
        await resolveCorrectAttack();
      } else {
        state.correctStreak = 0;
        selectedButton.classList.add("wrong");
        buttons[correctIndex].classList.add("correct");
        playWrongSound();
        flashAnswer("✕ 오답!", "bad");
        setMessage(`오답! 정답은 ${correctIndex + 1}. ${state.currentQuestion.choices[correctIndex]} 입니다.`, "bad");
        await sleep(180);
        await resolveWrongAttack();
      }

      // On the final stage, a finished battle goes straight to the clear/defeat result.
      // This prevents a treasure reward overlay from appearing after the final enemy is already defeated.
      let outcome = checkOutcome();
      const isFinalStage = isFinalCampaignStage();
      if (outcome && isFinalStage) {
        await sleep(80);
        if (outcome.win) await finishStage(outcome);
        else finishDefeat(outcome);
        return;
      }

      await maybeOpenTreasure();

      outcome = checkOutcome();
      if (outcome) {
        await sleep(80);
        if (outcome.win) await finishStage(outcome);
        else finishDefeat(outcome);
        return;
      }

      await sleep(260);
      pickQuestion();
      state.locked = false;
    }

    function checkOutcome() {
      if (state.enemyPos >= state.boardLength) return { win: true, fell: true };
      if (state.playerPos < 0) return { win: false, fell: true };
      if (state.enemyHp <= 0) return { win: true, fell: false };
      if (state.playerHp <= 0) return { win: false, fell: false };
      return null;
    }

    async function finishStage(outcome) {
      state.gameOver = true;
      setChoicesDisabled(true);
      if (outcome.fell) {
        enemyEl.classList.add("fall");
        playFallSound();
        await sleep(330);
      } else if (state.enemyHp <= 0) {
        await playEnemyDefeatAnimation();
      }

      playStageClearSound(Boolean(state.enemyBoss), Boolean(state.enemyFinalBoss));
      await applyStageClearHeal();

      const isFinal = isFinalCampaignStage();
      if (isFinal) {
        showFinalResult();
      } else {
        showRewardSelection();
      }
    }

    function rewardIsAvailable(reward) {
      const stageNum=state.stageIndex+1;
      if (stageNum < (reward.minStage||1)) return false;
      if ((reward.maxLevel||99) <= traitLevel(reward.id)) return false;
      if (reward.available && !reward.available()) return false;
      return true;
    }

    function adjustedRewardWeight(reward) {
      let w=RARITY_WEIGHT[reward.rarity]||50;
      const stageNum=state.stageIndex+1;
      if (state.enemyBoss && reward.rarity==="rare") w*=stageNum>=10?1.35:1.2;
      if (reward.rarity==="legendary") {
        if (stageNum<5) return 0;
        // v43: legendary cards should be rare, but visible often enough to matter in a 20-stage run.
        if (state.enemyBoss) w*=stageNum>=10?5:3;
      }
      return w;
    }

    function pickMajorRewards(count=3) {
      const pool=rewards.filter(rewardIsAvailable);
      const picked=weightedSample(pool,count,adjustedRewardWeight);
      // A reward screen may contain at most one legendary card.
      const legends=picked.filter(r=>r.rarity==="legendary");
      if (legends.length>1) {
        const keep=legends[0];
        const banned=new Set(legends.slice(1).map(r=>r.id));
        const replacements=weightedSample(pool.filter(r=>r.rarity!=="legendary"&&!picked.some(p=>p.id===r.id)),banned.size,adjustedRewardWeight);
        const cleaned=[]; let ri=0;
        for (const r of picked) cleaned.push(banned.has(r.id)?replacements[ri++]:r);
        return cleaned.filter(Boolean);
      }
      return picked;
    }

    function showRewardSelection() {
      rewardSubtitle.textContent=`STAGE ${state.stageIndex+1} 클리어 · 영구 보상 하나를 선택하세요.`;

    function getAccuracy() {
      return state.total ? Math.round((state.correct / state.total) * 100) : 0;
    }

    function getStandardRank(accuracy) {
      if (accuracy >= 98) return "SSS";
      if (accuracy >= 95) return "SS";
      if (accuracy >= 90) return "S";
      if (accuracy >= 80) return "A";
      if (accuracy >= 70) return "B";
      return "C";
    }

      const button = document.createElement("button");

      button.textContent = text;

    function finishDefeat(outcome) {

    function snapshotStageStart() {
      state.stageStartSnapshot = JSON.parse(JSON.stringify({
        playerMaxHp:state.playerMaxHp, playerHp:state.playerHp, playerDamage:state.playerDamage, playerPush:state.playerPush,

        questionGrade:state.questionGrade, remainingQuestionIndexes:state.remainingQuestionIndexes

    function retryCurrentStage() {
      const snap=state.stageStartSnapshot;
      if (snap) {
        for (const [k,v] of Object.entries(snap)) state[k]=JSON.parse(JSON.stringify(v));

    function startStage(isRetry) {
      const stageNumber = state.stageIndex + 1;
      const cfg = getStageConfig(stageNumber);
      state.currentStageConfig = cfg;
      state.boardLength=cfg.boardLength; state.enemyMaxHp=cfg.enemyHp; state.enemyHp=cfg.enemyHp;

      state.playerHp=Math.min(state.playerHp,state.playerMaxHp);
      state.correctStreak=0; state.stageCorrectAttacks=0; state.counterReady=false; state.revengeReady=false; state.backflowReady=false;
      state.stageShieldUsed=false; state.stageBraceUsed=false; state.enemyResistSuccesses=0; state.enemyFlatResistDebuff=0;
      const leftCenter=Math.floor(state.boardLength/2)-1; state.playerPos=leftCenter; state.enemyPos=leftCenter+1;

      if (!isRetry) {
        if (traitLevel("H07")>0 && state.playerHp <= state.playerMaxHp*.40) {
          state.playerHp=Math.min(state.playerMaxHp,state.playerHp+traitLevel("H07")*2);
        }
        state.treasures=chooseTreasurePositions();
        state.extraTreasureNextStage=0;
      } else state.treasures.forEach(item=>{item.triggered=false;});

      state.locked=true; state.gameOver=false;
      playerEl.classList.remove("fall","hit","attack-right","attack-left"); enemyEl.classList.remove("fall","hit","attack-right","attack-left","defeated","defeated-final");
      applyEnemyVisual();
      applyStageTheme(stageNumber);
      resultOverlay.classList.remove("show"); rewardOverlay.classList.remove("show"); treasureOverlay.classList.remove("show");
      updateBgmForStage();
      if (!isRetry && state.enemyBoss) setTimeout(() => playBossIntroSound(Boolean(state.enemyFinalBoss)), 170);
      stageInfoEl.textContent = GAME_MODE === "standard" ? `STAGE ${stageNumber} / ${STANDARD_STAGE_LIMIT}` : `ENDLESS · STAGE ${stageNumber}`;
      renderArenaTiles(); renderHp(playerHpEl,state.playerHp,state.playerMaxHp); renderHp(enemyHpEl,state.enemyHp,state.enemyMaxHp); renderStats();
      const unopenedTreasureCount=state.treasures.filter(item=>!item.opened).length;
      setMessage(`전체 맵을 확인하세요. · ${state.enemyTypeName} · 보물 ${unopenedTreasureCount}개`);
      pickQuestion(); setChoicesDisabled(true);
      requestAnimationFrame(()=>{renderPositions();setOverviewCamera(false);playStageCameraIntro(isRetry);});
      snapshotStageStart();
    }

    function fitGameCanvas() {

        return;

      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;

    window.addEventListener("resize", () => {
      fitGameCanvas();
      requestAnimationFrame(() => {
        renderPositions();
        if (state.cameraMode === "overview") setOverviewCamera(false);
        else followBattleCamera(false);
      });

    function resetRun() {
      if (!GAME_MODE) return;
      state.stageIndex=0; state.playerMaxHp=START_PLAYER_HP; state.playerHp=START_PLAYER_HP; state.playerDamage=1; state.playerPush=1;
      state.critChance=0; state.critMultiplier=2; state.shockChance=0; state.clearHealAmount=1; state.traits={}; state.tempEffects=[];
      state.undyingCharges=0; state.overchargeBonus=0; state.shockBuildupBonus=0; state.extraTreasureNextStage=0;
      state.correctStreak=0; state.correctAttackCount=0; state.stageCorrectAttacks=0; state.counterReady=false; state.revengeReady=false; state.backflowReady=false;
      state.stageShieldUsed=false; state.stageBraceUsed=false; state.enemyResistSuccesses=0; state.enemyFlatResistDebuff=0;
      state.treasures=[]; state.total=0; state.correct=0; state.stageStartSnapshot=null;
      state.generatedStages={}; state.currentStageConfig=null; state.enemyFinalBoss=false;
      state.currentQuestion=null; state.currentQuestionIndex=-1; state.questionGrade=null; state.remainingQuestionIndexes=[];
      hideStatusHelp(true);
      initializeQuestionRun();
      startStage(false);
    }

    function startGame(mode, grade = null) {
      unlockAudioAndPlay("battle");
      playMenuSelectSound(mode);
      GAME_MODE = mode;
      SELECTED_GRADE = mode === "standard" ? Number(grade) : null;
      startOverlay.classList.remove("show");
      resultOverlay.classList.remove("show");
      rewardOverlay.classList.remove("show");
      treasureOverlay.classList.remove("show");
      resetRun();
    }

    function returnToStart() {
      GAME_MODE = null;
      state.locked = true;
      state.gameOver = true;
      setChoicesDisabled(true);
      hideStatusHelp(true);
      resultOverlay.classList.remove("show");
      rewardOverlay.classList.remove("show");
      treasureOverlay.classList.remove("show");
      startOverlay.classList.add("show");
      startGate.hidden = true;
      modeSelectContent.hidden = false;
      gradeSelectContent.hidden = true;
      gameStageEl.classList.remove("awaiting-start");
      if (bgmEnabled) setBgmTrack("menu");
    }

    function showGradeSelect() {
      modeSelectContent.hidden = true;
      gradeSelectContent.hidden = false;
    }

    function showModeSelect() {
      gradeSelectContent.hidden = true;
      modeSelectContent.hidden = false;
    }

    function enterStartMenu() {
      if (startGate.hidden) return;
      unlockAudioAndPlay("menu");
      startGate.hidden = true;
      modeSelectContent.hidden = false;
      gradeSelectContent.hidden = true;
      gameStageEl.classList.remove("awaiting-start");
    }

    startGate.addEventListener("click", enterStartMenu);
    startGate.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        enterStartMenu();
      }
    });
    standardModeButton.addEventListener("click", showGradeSelect);
    endlessModeButton.addEventListener("click", () => startGame("endless"));
    gradeButtons.forEach(button => {
      button.addEventListener("click", () => startGame("standard", Number(button.dataset.grade)));
    });
    gradeBackButton.addEventListener("click", showModeSelect);
    bgmToggleButton.addEventListener("click", toggleBgm);

    setPixelAppearance(playerEl, "hero");
    requestAnimationFrame(animatePixelActors);
    fitGameCanvas();
    state.locked = true;
    state.gameOver = true;
    startOverlay.classList.add("show");
    startGate.hidden = false;
    modeSelectContent.hidden = true;
    gradeSelectContent.hidden = true;
    gameStageEl.classList.add("awaiting-start");
    updateBgmButton();
  </script>
</body>
</html>
